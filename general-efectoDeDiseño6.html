<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Efecto profundidad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.35), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.25), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(34, 197, 94, 0.18), transparent 25%),
        linear-gradient(135deg, #0f172a 0%, #111827 50%, #0b1220 100%);
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: min(1100px, 92vw);
      min-height: 620px;
      border-radius: 32px;
      padding: 64px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto auto 30px 40px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%);
      filter: blur(20px);
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -80px;
      right: -80px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.35), transparent 68%);
      filter: blur(25px);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 520px;
      color: white;
    }

    .content h1 {
      font-size: clamp(2.5rem, 5vw, 4.6rem);
      line-height: 0.95;
      margin-bottom: 18px;
      letter-spacing: -0.04em;
    }

    .content p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.78);
      max-width: 46ch;
    }

    .badges {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.92rem;
    }

    .visual {
      position: relative;
      z-index: 2;
      width: min(420px, 38vw);
      min-width: 320px;
      aspect-ratio: 4 / 5;
      display: grid;
      place-items: center;
    }

    .glow {
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.24), transparent 65%);
      filter: blur(22px);
      transform: translateY(40px);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -40px 20px -40px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.20), transparent 70%);
      filter: blur(18px);
      opacity: 0.8;
    }

    .blob {
      position: absolute;
      inset: auto;
      border-radius: 50%;
      filter: blur(18px);
      opacity: 0.9;
    }

    .blob.one {
      width: 220px;
      height: 220px;
      left: -30px;
      top: 30px;
      background: rgba(99, 102, 241, 0.50);
    }

    .blob.two {
      width: 180px;
      height: 180px;
      right: -20px;
      top: 70px;
      background: rgba(236, 72, 153, 0.35);
    }

    .portrait {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 92%;
      height: 92%;
      object-fit: cover;
      object-position: center top;
      filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.35));
    }

    .caption {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 18px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: white;
      backdrop-filter: blur(10px);
    }

    .caption strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .caption span {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.92rem;
    }

    @media (max-width: 900px) {
      .hero {
        padding: 34px;
        flex-direction: column;
        justify-content: center;
      }

      .visual {
        width: min(420px, 90vw);
      }

      .content {
        max-width: 100%;
        text-align: center;
      }

      .badges {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="content">
      <h1>Diseño con profundidad</h1>
      <p>
        Un fondo con degradados, luces suaves y una imagen PNG recortada al frente
        crea ese efecto moderno que ves en muchas páginas de personas o equipos.
      </p>

      <div class="badges">
        <div class="badge">Degradado radial</div>
        <div class="badge">Sombras suaves</div>
        <div class="badge">Imagen recortada</div>
      </div>
    </div>

    <div class="visual">
      <div class="glow"></div>

      <div class="card">
        <div class="blob one"></div>
        <div class="blob two"></div>

        <!-- Cambia esta imagen por tu PNG recortado -->
        <img
          class="portrait"
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80"
          alt="Persona"
        />

        <div class="caption">
          <strong>Perfil destacado</strong>
          <span>La profundidad sale de capas, brillo y contraste.</span>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
