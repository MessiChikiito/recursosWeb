<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UE Internacional – CTA final</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,700;14..32,900&display=swap" rel="stylesheet">
  <style>
    .cta-section {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .cta-section *,
    .cta-section *::before,
    .cta-section *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    .cta-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 96px 24px;
      text-align: center;
    }
    .cta-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #0132AF;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .btn-primary {
      display: inline-block;
      background: #0132AF;
      color: #ffffff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px 40px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease !important;
      letter-spacing: 0.01em;
    }
    .btn-primary:hover {
      background: #EF1218 !important;
      color: #ffffff !important;
    }
    .btn-primary:active {
      background: #c10f15 !important;
    }
    @media (max-width: 768px) {
      .cta-container {
        padding: 64px 24px;
      }
      .cta-title {
        font-size: 2rem;
        font-weight: 900;
      }
    }
  </style>
</head>
<body style="margin:0; background:#fff;">
  <div class="cta-section">
    <div class="cta-container">
      <h2 class="cta-title">Tu experiencia internacional comienza aquí</h2>
      <a href="#" class="btn-primary">Conoce las convocatorias</a>
    </div>
  </div>
</body>
</html>
