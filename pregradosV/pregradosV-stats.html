
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        .pp-stats-section {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 1336px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }

        .pp-stats-grid {
            display: grid;
            grid-template-columns: 2.2fr 0.9fr 0.9fr 0.9fr;
            gap: 24px;
        }

        .pp-stat-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            border: 1px solid #e3edff;
            border-top: 4px solid #067A2E;
            border-radius: 8px;
            padding: 32px 20px;
            text-align: center;
            transition: none !important;
            box-shadow: 0 10px 24px rgba(2,6,23,.06);
        }

        /* Card especial de becas */
        .pp-stat-card-becas {
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            text-align: left;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            border: 1px solid #e3edff;
            border-top: 4px solid #F59E0B;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(2,6,23,.06);
        }

        .pp-card-becas-content {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
        }

        .pp-card-becas-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .pp-card-becas-svg {
            width: 50px !important;
            height: 50px !important;
            flex-shrink: 0 !important;
        }

        .pp-card-becas-title {
            font-size: 1.7rem;
            font-weight: 900;
            color: #F59E0B;
            margin-bottom: 4px;
        }

        .pp-card-becas-subtitle {
            color: #4a5568;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .pp-becas-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .pp-becas-list li {
            padding: 2px 0;
            color: #4a5568;
            font-size: 0.8rem;
            line-height: 1.3;
            font-weight: 700;
        }

        .pp-becas-list li.highlight-blue {
            color: #0132AF;
            font-weight: 600;
        }

        .pp-becas-list li:before {
            content: "✓ ";
            color: #F59E0B;
            font-weight: bold;
            margin-right: 6px;
        }

        .pp-stats-grid .pp-stat-card:not(.pp-stat-card-becas):nth-child(3) {
            border-top-color: #0BD926;
        }

        .pp-stats-grid .pp-stat-card:not(.pp-stat-card-becas):nth-child(2) {
            border-top-color: #0BD926;
        }

        .pp-stats-grid .pp-stat-card:not(.pp-stat-card-becas):nth-child(4) {
            border-top-color: #0BD926;
        }

        .pp-stat-card > div {
            font-weight: 900;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: block;
            font-size: 2rem;
            color: #000;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .pp-stat-card p {
            color: #0A943A;
            font-size: 1rem;
            margin: 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .pp-stat-card-discount {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            border: 1px solid #e3edff;
            border-top: 4px solid #0BD926;
            border-radius: 8px;
            padding: 32px 20px;
            padding-top: 15px;
            text-align: center;
            transition: none !important;
            box-shadow: 0 10px 24px rgba(2,6,23,.06);
        }

        .pp-discount-investment-badge {
            background: #EF1218;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-block;
        }

        .pp-discount-investment-old {
            color: #4a5568;
            font-size: 0.95rem;
            text-decoration: line-through;
            margin-bottom: 12px;
        }

        .pp-discount-investment-new {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: block;
            font-size: 1.9rem;
            font-weight: 900;
            color: #000;
            margin-bottom: 0px;
            margin-top: -8px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 0.6px rgba(0,0,0,0.02);
        }

        .pp-stat-card-discount p {
            color: #0A943A;
            font-size: 1rem;
            margin: 0;
            font-weight: 600;
            line-height: 1.4;
        }

        @media (max-width: 992px) {
            .pp-stats-grid {
                grid-template-columns: 1.5fr 1fr 1fr 1fr;
                gap: 16px;
            }
        }

        /* Móvil */
        @media (max-width: 768px) {
            .pp-stats-section {
                padding: 0 16px;
            }

            body {
                padding: 32px 16px;
            }

            .pp-stats-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .pp-stat-card {
                padding: 24px 16px;
            }

            .pp-stat-card-becas {
                padding: 16px;
            }

            .pp-card-becas-content {
                gap: 16px;
            }

            .pp-card-becas-svg {
                width: 40px;
                height: 40px;
            }

            .pp-card-becas-title {
                font-size: 1.3rem;
            }

            .pp-stat-card > div {
                font-size: 1.5rem;
            }

            .pp-card-becas-subtitle {
                font-weight: 500;
            }
            .pp-discount-investment-new{
                font-weight: bold;
            }
        }

        @media (max-width: 480px) {
            .pp-stats-section {
                padding: 0 16px;
            }

            body {
                padding: 24px 12px;
            }

            .pp-stat-card {
                padding: 20px 12px;
            }

            .pp-card-becas-title {
                font-size: 1.1rem;
            }

            .pp-stat-card > div {
                font-size: 1.3rem;
            }

            .pp-stat-card p {
                font-size: 0.85rem;
            }

            .pp-card-becas-subtitle {
                font-weight: 500;
            }

            .pp-discount-investment-new{
                font-weight: bold;
            }
        }
    </style>
</head>
<body>

    <section class="pp-stats-section" id="pp-caja-stats">
        <div class="pp-stats-grid">
            <div class="pp-stat-card-becas">
                <div class="pp-card-becas-content">
                    <svg class="pp-card-becas-svg" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="25" r="12" fill="none" stroke="#F59E0B" stroke-width="2"/>
                        <path d="M18 25L30 15L42 25" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M30 37 Q15 42 15 48 Q15 52 20 54 L40 54 Q45 52 45 48 Q45 42 30 37" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="30" cy="48" r="3" fill="#F59E0B"/>
                    </svg>
                    <div class="pp-card-becas-text">
                        <h1 class="pp-card-becas-title">Becas y Financiamiento</h1>
                        <a class="pp-card-becas-subtitle">Múltiples opciones para tu acceso</a>
                        <ul class="pp-becas-list">
                            <li class="highlight-blue">Becas con jóvenes a la E</li>
                            <li>Opciones de financiación flexible</li>
                            <li>Convenios institucionales</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="pp-stat-card-discount">
                <div class="pp-discount-investment-badge">-40% DESCUENTO</div>
                <div class="pp-discount-investment-old">$6.757.000</div>
                <div class="pp-discount-investment-new">$4.054.200</div>
                <p>Inversión por semestre</p>
            </div>
            <div class="pp-stat-card">
                <div>87%</div>
                <p>Tasa de empleabilidad</p>
            </div>
            <div class="pp-stat-card">
                <div>350+</div>
                <p>Empresas Aliadas</p>
            </div>
        </div>
    </section>

</body>
</html>
