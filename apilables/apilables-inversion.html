<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversión del curso - Uniempresarial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
        }

        .ue-section-financiacion {
            padding: 0;
            max-width: 1200px;
            margin: 0 auto;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .ue-h3{
            color: #0132AF !important;
        }
        
        .ue-headRow {
            display: flex;
            gap: 14px;
            justify-content: flex-start;
            align-items: flex-start;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .ue-finGrid {
            display: grid;
            grid-template-columns: minmax(300px, 400px);
            gap: 20px;
        }

        .ue-finCard {
            background: #ffffff;
            border-radius: 12px !important;
            border: 1px solid #e0e3e8;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 0;
            transition: all 0.3s ease !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
        }

        .ue-finCard::before {
            border-radius: 12px 12px 0px 0px !important;
            content: '';
            display: block;
            height: 6px;
            width: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
            background: linear-gradient(90deg, #0132AF 0%, #1a5bcf 100%);
            box-shadow: 0 4px 12px rgba(1, 50, 175, 0.2);
        }

        .ue-finCard > div {
            padding: 28px;
        }

        .ue-finK {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #0132AF;
        }

        .ue-finV {
            font-size: 32px;
            color: #092b57;
            font-weight: 600;
            margin-top: 5px;
        }

        .ue-finV p {
            margin: 0;
        }

        .ue-badge-urgent-fin {
            position: absolute;
            width: max-content;
            top: 74%;
            left: 78%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff0033 0%, #fc3232 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 0 0px rgba(255, 23, 68, 0.7);
            z-index: 10;
            text-transform: uppercase;

        }

        .ue-fin-card-discount {
            position: relative;
        }

        .ue-price-before {
            font-size: 14px;
            color: #999;
            text-decoration: line-through;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 0;
        }

        .ue-discount-message {
            font-size: 13px;
            color: #7a8a99;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .ue-savings-text {
            font-size: 16px;
            font-weight: 900;
            color: #0BD926;
            margin-top: 12px;
        }

        @media (max-width: 980px) {
            .ue-finGrid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
                
            .ue-section-financiacion {
                padding-left: 15px;
                padding-right: 15px;
                padding-bottom: 30px;
                font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
            }
            
            .ue-finGrid {
                grid-template-columns: 1fr;
            }
            .ue-section {
                padding: 30px 15px;
            }
            h3.ue-h3 {
                font-size: 20px;
            }
            
            .ue-finK {
                font-size: 18px !important;
                font-weight: 800 !important;
                font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
            }
            
            .ue-price-large {
                font-size: 40px !important;
            }

            .ue-badge-urgent-fin {
                font-size: 11px;
                top: 46%;
                left: 80%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>
        
    <section id="financiacion" class="ue-section-financiacion" aria-label="Inversión">
        <div class="ue-headRow">
            <div>
                <h3 class="ue-h3" style="margin:0">Inversión del curso</h3>
            </div>
        </div>

        <div class="ue-finGrid">

            <div class="ue-finCard ue-fin-card-discount">
                <span class="ue-badge-urgent-fin">XX% de descuento</span>
                <div>
                    <div class="ue-finK">Inversión del curso</div>
                    <div class="ue-price-before">Antes: $X.XXX.XXX</div>
                    <div class="ue-finV"><p>$X.XXX.XXX</p></div>
                    <div class="ue-discount-message">¡Aprovecha esta oportunidad!</div>
                    <div class="ue-savings-text">Ahorras $X.XXX.XXX</div>
                </div>
            </div>
            
            <!-- SIN DESCUENTO
            <div class="ue-finCard" style="position: relative;">
                <span class="ue-badge-regular">Precio Regular</span>
                <div>
                    <div class="ue-finK">Inversión del curso</div>
                    <div class="ue-price-large">$X.XXX.XXX</div>
                    <div class="ue-benefits-title">Beneficios incluídos</div>
                    <ul class="ue-list-benefits">
                        <li>Descuentos de estudiante</li>
                        <li>Acceso a biblioteca digital</li>
                        <li>Acceso a plataformas</li>
                        <li>Libros y materiales incluidos</li>
                    </ul>
                </div>
            </div> 
            -->
            
        </div>
    </section>
</body>
</html>
