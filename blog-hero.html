<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero y Card Destacada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 20px 150px;
            background-color: #00000000;
            min-height: 60vh;
        }

        /* Contenedor de texto del hero */
        .hero-text {
            flex: 1 1 50%;
            min-width: 300px;
            padding-right: 2rem;
        }

        .hero-subtitle {
            color: #ff0011;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 1rem;
        }

        .hero-title {
            font-size: 4rem;
            color: #0132AF;
            margin: 1rem 0;
            line-height: 1.1;
            font-weight: 800;
        }

        .hero-logo {
            display: block;
            width: min(100%, 450px);
            height: auto;
            margin: 0 0 0.4rem 0;
        }

        .hero-description {
            font-size: 1.5rem;
            color: #4a5568;
            margin-bottom: 2rem;
            line-height: 1.6;
            max-width: 90%;
        }

        .hero-button {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            background-color: #ff0011;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px -1px rgba(226, 6, 19, 0.4);
        }

        .hero-button:hover {
            background-color: #d90010;
            color: #fff;
        }

        /* Contenedor de la card destacada */
        .hero-card-wrapper {
            flex: 0 1 400px;
            margin-top: 2rem;
            min-width: 300px;
            position: relative;
        }

        .card-label {
            margin-bottom: 1rem;
            text-align: left;
        }

        .card-label-text {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #002855;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Imagen de la card */
        .card-image {
            height: 200px;
            background-color: #cbd5e0;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: #002855;
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: bold;
        }

        /* Contenido de la card */
        .card-content {
            padding: 1.5rem;
        }

        .card-date {
            color: #718096;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.25rem;
            color: #002855;
            margin: 0 0 1rem 0;
            line-height: 1.4;
            font-weight: bold;
        }

        .card-description {
            color: #4a5568;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .card-link {
            color: #ff0011;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.3s;
        }

        .card-link:hover {
            gap: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <section class="hero-section">

        <!-- Texto del Hero -->
        <div class="hero-text">
            <span class="hero-subtitle">Conocimiento a tu alcance</span>

            <img class="hero-logo" src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Logo-scaled.webp" alt="Logo Blog Uniempresarial">
            <p class="hero-description">
                Todo lo que necesitas para construir una experiencia universitaria increíble.
            </p>
            <a href="#" class="hero-button">Regístrate al newsletter</a>
        </div>
        


    </section>

</body>
</html>
