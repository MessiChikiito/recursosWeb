<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slider</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .slider-container {
    position: relative;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    background-color: #f4f4f4;
  }

  .slider-track {
    display: flex;
    transition: transform 0.5s ease-in-out !important;
    width: 100%;
    height: auto;
    will-change: transform;
  }

  .slide {
    flex: 0 0 100% !important;
    position: relative;
    display: block;
  }

  .slide a {
    width: 100%;
    display: block;
    text-decoration: none;
    line-height: 0;
  }

  .slide img, .slide picture {
    width: 100% !important;
    height: auto !important;
    display: block !important;
    object-fit: cover !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    box-shadow: none !important;
  }

  .slide img {
    aspect-ratio: 1860 / 550;
  }

  .slide img.img-movil {
    display: none !important;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.4) !important;
    color: white !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    width: 44px !important;
    height: 44px !important;
    border-radius: 50% !important;
    cursor: pointer;
    z-index: 9 !important;
    font-size: 1.2rem !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition: all 0.3s ease !important;
    opacity: 0.8 !important;
    padding: 0 !important;
    line-height: 1 !important;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
  }

  .nav-btn:focus, .nav-btn:active {
    outline: none !important;
    box-shadow: none !important;
  }

  .slider-container:hover .nav-btn {
    opacity: 1 !important;
  }

  .nav-btn:hover {
    background: rgba(204, 0, 0, 0.8) !important;
    color: white !important;
    transform: translateY(-50%) scale(1.05) !important;
  }

  .prev-btn { left: 20px !important; }
  .next-btn { right: 20px !important; }

  .dots-container {
    position: absolute;
    bottom: 20px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    display: flex !important;
    gap: 12px !important;
    z-index: 9 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .dot {
    width: 12px !important;
    height: 12px !important;
    background: rgba(255, 255, 255, 0.5) !important;
    border-radius: 50% !important;
    cursor: pointer !important;
    transition: all 0.3s ease !important;
    border: 2px solid transparent !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .dot:hover { background: rgba(255, 255, 255, 0.9) !important; }
  .dot.active {
    background: #cc0000 !important;
    transform: scale(1.3) !important;
    border-color: rgba(255,255,255,0.8) !important;
  }

    @media (max-width: 768px) {
    .slide img.img-pc {
      display: none !important;
    }
    
    .slide img.img-movil {
      display: block !important;
    }

    .slide img {
      aspect-ratio: 430 / 300 !important;
    }

    .nav-btn {
      width: 36px !important;
      height: 36px !important;
      font-size: 1rem !important;
      background: rgba(0, 0, 0, 0.5) !important;
    }

    .prev-btn { left: 10px !important; }
    .next-btn { right: 10px !important; }
    
    .dots-container {
        gap: 6px !important;
        bottom: 8px !important;
    }
    .dot {
        width: 6px !important;
        height: 6px !important;
        border: 1px solid transparent !important;
    }
  }
</style>
</head>
<body>

<div class="slider-container" id="mainSlider">
  
  <div class="slider-track" id="track">
    
    <div class="slide">
        <a href="https://wa.me/573142084103" target="_blank">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Banners-Rompela_Banner-Descuentos-PC-scaled.webp" alt="Rómpela - Descuentos" class="img-pc skip-lazy" data-skip-lazy="1" fetchpriority="high" loading="eager" decoding="async">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Banners-Rompela_Banner-Descuentos-Movil-1.webp" alt="Rómpela - Descuentos" class="img-movil skip-lazy" data-skip-lazy="1" fetchpriority="high" loading="eager" decoding="async">
        </a>
    </div>

    <div class="slide">
        <a href="https://uniempresarial.edu.co/financiacion/" target="_blank">  
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Rompela_Banner-Financiamiento-PC-scaled.webp" alt="Financiamiento" class="img-pc skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Banners-Rompela_Banner-Financiamiento-Movil.webp" alt="Financiamiento" class="img-movil skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
        </a>
    </div>

    <div class="slide">
        <a href="https://uniempresarial.edu.co/convenios-uniempresarial/" target="_blank">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Rompela_Banner-Coformacion-PC-scaled.webp" alt="Coformación" class="img-pc skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Banners-Rompela_Banner-Coformacion-Movil.webp" alt="Coformación" class="img-movil skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
        </a>
    </div>

    <div class="slide">
        <a href="https://fabricasoluciones.uniempresarial.edu.co/" target="_blank">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Rompela_Banner-Fusoft-PC-scaled.webp" alt="Fusoft" class="img-pc skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
            <img src="https://uniempresarial.edu.co/wp-content/uploads/2026/03/Banners-Rompela_Banner-Fusoft-Movil.webp" alt="Fusoft" class="img-movil skip-lazy" data-skip-lazy="1" loading="eager" decoding="async">
        </a>
    </div>

  </div>

  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>

  <div class="dots-container" id="dotsContainer"></div>

</div>

<script>
  const track = document.getElementById('track');
  const slides = document.querySelectorAll('.slide');
  const dotsContainer = document.getElementById('dotsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  let currentIndex = 1; 
  let isTransitioning = false;
  let autoplayInterval;

  const firstClone = slides[0].cloneNode(true);
  const lastClone = slides[slides.length - 1].cloneNode(true);
  
  firstClone.id = 'first-clone';
  lastClone.id = 'last-clone';

  track.appendChild(firstClone);
  track.insertBefore(lastClone, slides[0]);

  const allSlides = document.querySelectorAll('.slide');
  const totalSlides = allSlides.length;
  
  track.style.setProperty('transition', 'none', 'important');
  track.style.transform = `translateX(-100%)`;

  slides.forEach((_, index) => {
    const dot = document.createElement('div');
    dot.classList.add('dot');
    if (index === 0) dot.classList.add('active');
    dot.addEventListener('click', () => {
        if (isTransitioning) return;
        goToSlide(index + 1); 
        resetAutoplay();
    });
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');

  function updateDots() {
    let dotIndex = currentIndex - 1;
    if (currentIndex === totalSlides - 1) dotIndex = 0; 
    if (currentIndex === 0) dotIndex = slides.length - 1; 
    dots.forEach((dot, index) => {
      dot.classList.toggle('active', index === dotIndex);
    });
  }

  function goToSlide(index) {
    if (isTransitioning) return;
    isTransitioning = true;
    
    track.style.setProperty('transition', 'transform 0.5s ease-in-out', 'important');
    currentIndex = index;
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    updateDots();
  }

  track.addEventListener('transitionend', () => {
    isTransitioning = false;

    if (currentIndex === totalSlides - 1) {
        track.style.setProperty('transition', 'none', 'important');
        currentIndex = 1;
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    if (currentIndex === 0) {
        track.style.setProperty('transition', 'none', 'important');
        currentIndex = slides.length;
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
  });

  function nextSlide() { 
      if (isTransitioning) return;
      goToSlide(currentIndex + 1); 
  }
  
  function prevSlide() { 
      if (isTransitioning) return;
      goToSlide(currentIndex - 1); 
  }

  nextBtn.addEventListener('click', () => {
      nextSlide();
      resetAutoplay();
  });
  
  prevBtn.addEventListener('click', () => {
      prevSlide();
      resetAutoplay();
  });

  function startAutoplay() {
    clearInterval(autoplayInterval);
    autoplayInterval = setInterval(() => {
        nextSlide();
    }, 10000);
  }

  function resetAutoplay() {
    clearInterval(autoplayInterval);
    startAutoplay();
  }

  let touchStartX = 0;
  let touchEndX = 0;

  track.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    clearInterval(autoplayInterval);
  });

  track.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
    startAutoplay(); 
  });

  function handleSwipe() {
    if (touchEndX < touchStartX - 50) nextSlide();
    if (touchEndX > touchStartX + 50) prevSlide();
  }

  startAutoplay();

</script>

</body>
</html>
