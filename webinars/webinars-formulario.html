<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>
  
<style>
    body{
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #06325a;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    * {
        box-sizing: border-box;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(1, 50, 175, .08);
        border-color: rgba(1, 50, 175, .35);
    }

    .ue-card {
        background: #ffffff; 
        border: 1px solid #e2e8f0; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 40px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        min-height: 400px;
    }

    .base-eyebrow { 
        color: #EA0A2A; 
        font-weight: 700; 
        text-transform: uppercase; 
        font-size: 13px; 
        letter-spacing: 1px; 
        margin-bottom: 12px; 
    }

    .var-e-title-mega { 
        font-size: 42px; 
        font-weight: 800; 
        color: #0132AF; 
        margin: 0 0 20px; 
        line-height: 1.1; 
        letter-spacing: -1px; 
    }

    .var-e-desc-large { 
        font-size: 16px; 
        color: #475569; 
        margin: 0; 
        line-height: 1.6; 
    }

    @media (max-width: 640px) {
      .ue-card { padding: 30px 20px; margin: 0 15px; min-height: auto; }
      .var-e-title-mega { font-size: 32px; }
      .var-e-desc-large { font-size: 15px; }
    }
</style>

  <div class="ue-card" id="whyUs">
    <div class="base-eyebrow">Edición 2026</div>
    <h3 class="var-e-title-mega">Tu próximo gran salto laboral comienza aquí.</h3>
    <p class="var-e-desc-large">Comprende cómo la tecnología, el comercio y la administración convergen. Inscríbete en segundos en el formulario y asegura un lugar en la primera fila digital de las Masterclasses.</p>
  </div>

</body>
</html>
