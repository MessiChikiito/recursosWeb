<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficios Renovación | Opción Final</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F7FA;
            padding: 40px 0;
        }

        .banner-beneficios {
            background-color: #EA0A2A;
            padding: 100px 20px;
            width: 100%;
        }

        .opt-container {
            max-width: 1200px;
            margin: 0 auto;
            color: #FFFFFF;
        }

        .opt-title {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 60px;
            line-height: 1.1;
        }

        .opt-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .opt-row {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 35px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            color: #EA0A2A;
        }

        .opt-date {
            flex: 0 0 250px;
            font-size: 22px;
            font-weight: 700;
            border-right: 1px solid rgba(234, 10, 42, 0.2);
            padding-right: 30px;
        }

        .opt-stats {
            display: flex;
            gap: 40px;
            flex: 1;
        }

        .opt-stat-item {
            display: flex;
            flex-direction: column;
        }

        .opt-stat-value {
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
            color: #EA0A2A;
        }

        .opt-stat-label {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-top: 6px;
            color: #333333;
        }

        .opt-btn-webinar {
            background: #EA0A2A;
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease !important;
        }

        .opt-btn-webinar:hover {
            background: #C90820;
            color: #FFFFFF;
        }

        .opt-btn-webinar svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease !important;
        }

        .opt-btn-webinar:hover svg {
            transform: translateX(4px);
        }

        @media (max-width: 992px) {
            .opt-row {
                flex-direction: column;
                align-items: stretch;
                padding: 30px 20px;
                gap: 30px;
            }

            .opt-date {
                background: #FFE8ED;
                color: #EA0A2A;
                display: inline-block;
                padding: 8px 16px;
                border-radius: 30px;
                font-size: 16px;
                font-weight: 700;
                border: none;
                flex: auto;
                align-self: flex-start;
            }

            .opt-stats {
                flex-direction: column;
                gap: 20px;
            }

            .opt-stat-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #E0E5EB;
                padding-bottom: 12px;
            }

            .opt-stat-label {
                font-size: 16px;
                font-weight: 500;
                text-transform: none;
                margin-top: 0;
            }

            .opt-stat-value {
                font-size: 28px;
            }

            .opt-btn-webinar {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <section class="banner-beneficios">
        <div class="opt-container">
            
            <h2 class="opt-title">Beneficios por la renovación de tu matrícula mercantil 2026</h2>

            <div class="opt-grid">
                
                <div class="opt-row">
                    <div class="opt-date">1 Enero al 16 Marzo</div>
                    
                    <div class="opt-stats">
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Pregrado Presencial</span>
                            <span class="opt-stat-value">25%</span>
                        </div>
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Pregrado Virtual</span>
                            <span class="opt-stat-value">45%</span>
                        </div>
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Posgrados</span>
                            <span class="opt-stat-value">25%</span>
                        </div>
                    </div>

                    <a href="#webinars" class="opt-btn-webinar">
                        Todos los webinars
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </a>
                </div>

                <div class="opt-row">
                    <div class="opt-date">17 al 31 de Marzo</div>
                    
                    <div class="opt-stats">
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Pregrado Presencial</span>
                            <span class="opt-stat-value">20%</span>
                        </div>
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Pregrado Virtual</span>
                            <span class="opt-stat-value">25%</span>
                        </div>
                        <div class="opt-stat-item">
                            <span class="opt-stat-label">Posgrados</span>
                            <span class="opt-stat-value">20%</span>
                        </div>
                    </div>

                    <a href="#webinars-1" class="opt-btn-webinar">
                        Acceso a 1 webinar
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </a>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
