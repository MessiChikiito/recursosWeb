<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programas</title>
    <style>
        .ue-programas-container {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: transparent;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Botones de filtro centrados */
        .ue-filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
        }

        .cg-tab-btn {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1a202c;
            border: 1px solid #e2e8f0;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease !important;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .cg-tab-btn:focus {
            outline: none !important;
        }
        .cg-tab-btn:focus-visible {
            outline: none !important;
        }
        .cg-tab-btn.active {
            background-color: #0132AF;
            color: #ffffff;
            border-color: #0132AF;
        }
        /* Botón de Posgrados activo con color naranja */
        #btn-posgrados.active {
            background-color: #FF6016;
            border-color: #FF6016;
        }

        #btn-posgrados:hover:not(.active) {
            background-color: #00000000;
            border-color: #FF6016;
            color: #FF6016;
        }
        .cg-tab-btn:hover:not(.active) {
            background-color: #00000000;
            border: solid 1px;
            border-color: #0132AF;
            color: #0132AF;
        }
        .cg-tab-btn:active:not(.active) {
            background-color: #f1f5f9;
            color: #1a202c;
            border-color: #e2e8f0;
        }

        .ue-programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 50px;
        }

        .ue-icon {
            width: 18px !important;
            height: 18px !important;
            display: inline-block;
            vertical-align: middle;
            fill: none !important;
            stroke: currentColor !important;
            stroke-width: 2 !important;
            stroke-linecap: round !important;
            stroke-linejoin: round !important;
        }

        .ue-card-program {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            border-left: 4px solid #0132AF;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        /* Línea lateral naranja para tarjetas de Posgrados */
        .ue-card-program.ue-posgrado {
            border-left-color: #FF6016;
        }

        .ue-card-program-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 15px;
        }

        .ue-card-program-title {
            font-size: 24px;
            font-weight: 800;
            color: #1a202c;
            line-height: 1.2;
            margin: 0;
        }

        .ue-card-program-badge {
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .ue-card-program-badge.virtual {
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: #ffffff;
        }

        .ue-card-program-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .ue-card-program-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #334155;
            font-weight: 600;
        }

        .ue-card-program-meta-item:not(:last-child)::after {
            content: "/";
            color: #cbd5e1;
            margin-left: 10px;
            font-size: 14px;
            font-weight: 400;
        }

        /* SVG icons for all cards default (pregrados) → red */
        .ue-card-program-meta-item svg {
            color: #EF1218;
        }

        /* SVG icons for posgrados → blue */
        .ue-card-program.ue-posgrado .ue-card-program-meta-item svg {
            color: #475569;
        }

        .ue-card-program-bullets {
            list-style: none;
            margin: 0 0 5px 0;
            padding: 0;
            flex-grow: 1;
        }

        .ue-card-program-bullets li {
            font-size: 14px;
            color: #475569;
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        /* Bullets for all cards default (pregrados) → red */
        .ue-card-program-bullets li::before {
            content: "•";
            color: #EF1218;
            font-size: 18px;
            font-weight: bold;
            position: absolute;
            left: 0;
            top: -3px;
        }

        /* Bullets for posgrados → blue */
        .ue-card-program.ue-posgrado .ue-card-program-bullets li::before {
            color: #0132AF;
        }

        .ue-card-program-actions {
            display: flex;
            justify-content: flex-start;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
            margin-top: auto;
        }

        .ue-card-program-btn {
            background: #1a202c;
            color: #ffffff !important;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none !important;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .ue-card-program-btn::after {
            content: "→";
            font-size: 16px;
            margin-left: 8px;
        }

        .ue-card-program-btn:hover {
            background: #0132AF;
        }

        /* Hover naranja para el botón "Ir al curso" en tarjetas de posgrados, manteniendo el fondo negro base */
        .ue-card-program.ue-posgrado .ue-card-program-btn:hover {
            background: #FF6016;
        }

        .ue-card-program-btn:hover::after {
            margin-left: 12px;
        }

        .ue-card-program-related {
            margin-top: 5px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #0132AF;
        }

        .ue-card-program-related a {
            display: inline-block;
            background-color: #e8e8e8;
            padding: 4px 10px;
            border-radius: 20px;
            margin-right: 8px;
            margin-top: 8px;
            font-size: 9px;
            color: #333;
            text-decoration: none;
            border: none;
            transition: all 0.2s;
        }

        .ue-card-program-related a:hover {
            background-color: #0132AF;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .ue-programs-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .ue-programas-container {
                padding: 20px 15px;
            }
            .ue-card-program {
                padding: 20px;
            }
            .ue-card-program-title {
                font-size: 24px;
            }
            .ue-card-program-meta {
                padding: 12px;
                gap: 10px;
            }
            .ue-card-program-meta-item {
                font-size: 12px;
            }
            .ue-card-program-meta-item:not(:last-child)::after {
                margin-left: 2px;
            }
            .ue-card-program-bullets li {
                font-size: 13px;
            }
            .ue-card-program-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .ue-filter-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<!-- Botones de filtro centrados -->
<div class="ue-filter-buttons">
    <button class="cg-tab-btn active" id="btn-pregrados">Cursos Homologables (Pregrados)</button>
    <button class="cg-tab-btn" id="btn-posgrados">Cursos Homologables (Posgrados)</button>
</div>

<!-- Sección Posgrados (sin título h2) -->
<div class="ue-programas-container" id="seccion-posgrados" style="display: none;">

<!-- Sección Pregrados (sin título h2) -->

        const clockSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="ue-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
        const calendarSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="ue-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;

        // Función para crear una tarjeta
        function createCard(curso) {
            const article = document.createElement('article');
            article.className = 'ue-card-program';

            const header = document.createElement('div');
            header.className = 'ue-card-program-header';
            const title = document.createElement('h3');
            title.className = 'ue-card-program-title';
            title.textContent = curso.title;
            header.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'ue-card-program-meta';
            const horasItem = document.createElement('div');
            horasItem.className = 'ue-card-program-meta-item';
            horasItem.innerHTML = clockSVG + ' ' + curso.horas;
            const modalidadItem = document.createElement('div');
            modalidadItem.className = 'ue-card-program-meta-item';
            modalidadItem.innerHTML = calendarSVG + ' Modalidad: ' + curso.modalidad;
            meta.appendChild(horasItem);
            meta.appendChild(modalidadItem);

            const ul = document.createElement('ul');
            ul.className = 'ue-card-program-bullets';
            curso.bullets.forEach(b => {
                const li = document.createElement('li');
                li.textContent = b;
                ul.appendChild(li);
            });

            const related = document.createElement('div');
            related.className = 'ue-card-program-related';
            related.innerHTML = 'Carreras relacionadas:<br>';
            curso.related.forEach(carrera => {
                const a = document.createElement('a');
                a.href = carrera.url;
                a.textContent = carrera.nombre;
                related.appendChild(a);
            });

            const actions = document.createElement('div');
            actions.className = 'ue-card-program-actions';
            const btn = document.createElement('a');
            btn.className = 'ue-card-program-btn';
            btn.href = curso.link;
            btn.innerHTML = '<span>Ir al curso</span>';
            actions.appendChild(btn);

            article.appendChild(header);
            article.appendChild(meta);
            article.appendChild(ul);
            article.appendChild(related);
            article.appendChild(actions);
            return article;
        }

            const card = createCard(curso);
            card.classList.add('ue-posgrado'); // Asigna la línea naranja
            posgradoContainer.appendChild(card);

        cursosPregrado.forEach(curso => pregradoContainer.appendChild(createCard(curso)));

        // Lógica de filtro
        const seccionPosgrados = document.getElementById('seccion-posgrados');
        const seccionPregrados = document.getElementById('seccion-pregrados');
        const btnPosgrados = document.getElementById('btn-posgrados');
        const btnPregrados = document.getElementById('btn-pregrados');

        function mostrarSeccion(tipo) {
            if (tipo === 'posgrados') {
                seccionPosgrados.style.display = 'block';
                seccionPregrados.style.display = 'none';
                btnPosgrados.classList.add('active');
                btnPregrados.classList.remove('active');
            } else {
                seccionPosgrados.style.display = 'none';
                seccionPregrados.style.display = 'block';
                btnPosgrados.classList.remove('active');
                btnPregrados.classList.add('active');
            }
        }

        btnPosgrados.addEventListener('click', () => mostrarSeccion('posgrados'));
        btnPregrados.addEventListener('click', () => mostrarSeccion('pregrados'));

        // Estado inicial: Pregrados visible
