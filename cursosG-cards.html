const clockSVG = '<svg class="cg-icon" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>';

const fallbackSVG = 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 400 200%27%3E%3Crect width=%27400%27 height=%27200%27 fill=%27%23e2e8f0%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 font-family=%27Arial%27 font-size=%2716%27 text-anchor=%27middle%27 dominant-baseline=%27middle%27 fill=%27%23475569%27%3EImagen no disponible%3C/text%3E%3C/svg%3E';

function getBadgeClass(tab) {
  if (tab === 1) return 'cg-badge-nuevo';
  if (tab === 2) return 'cg-badge-homologable';
  if (tab === 3) return 'cg-badge-diplomado';
  return 'cg-badge-nuevo';
}

function getTabClass(tab) {
  if (tab === 1) return 'cursos-tab';
  if (tab === 2) return 'homologables-tab';
  if (tab === 3) return 'diplomados-tab';
  return '';
}

function renderCards(tabId) {
  const filteredCards = cursosData.filter(card => card.tab === tabId);
  const grid = document.getElementById(`tab${tabId}`);
  
  grid.innerHTML = filteredCards.map(card => `
    <article class="cg-card ${getTabClass(card.tab)}">
      <div class="cg-card-image-container" style="background-image: url('${card.imagen_desktop}');" data-mobile="${card.imagen_mobile}">
        <div class="${getBadgeClass(card.tab)}">${card.badge}</div>
      </div>
      <h3 class="cg-card-title">${card.nombre}</h3>
      <div class="cg-card-meta">
        <div class="cg-card-meta-item">
          ${calendarSVG}
          Inicio: ${card.inicio}
        </div>
        <div class="cg-card-meta-item">
          ${clockSVG}
          ${card.duracion}
        </div>
      </div>
      <ul class="cg-card-bullets">
        ${card.bullets.map(bullet => `<li>${bullet}</li>`).join('')}
      </ul>
      <div class="cg-card-actions">
        <a class="cg-card-link" href="${card.link}">
          Ver detalles
          <span>→</span>
        </a>
      </div>
    </article>
  `).join('');
}

function setupIntersectionObserver() {
  const lazyImages = document.querySelectorAll('img[loading="lazy"]');
  
  if ('IntersectionObserver' in window) {
    const imageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          observer.unobserve(img);
        }
      });
    }, {
      rootMargin: '200px 0px',
      threshold: 0.01
    });
    
    lazyImages.forEach(img => imageObserver.observe(img));
  }
}

function updateBackgroundImages() {
  const isMobile = window.innerWidth <= 767;
  const containers = document.querySelectorAll('.cg-card-image-container');
  
  containers.forEach(container => {
    if (isMobile && container.dataset.mobile) {
      container.style.backgroundImage = `url('${container.dataset.mobile}')`;
    } else if (!isMobile) {
      // Store desktop image in data attribute on first render
      const style = window.getComputedStyle(container);
      const currentBg = style.backgroundImage;
      if (!container.dataset.desktop && currentBg !== 'none') {
        container.dataset.desktop = currentBg.slice(5, -2); // Extract URL
      }
      // For desktop, keep the original background-image from inline style
      if (container.dataset.desktop && !currentBg.includes(container.dataset.desktop)) {
        container.style.backgroundImage = `url('${container.dataset.desktop}')`;
      }
    }
  });
}

function showTab(tabId) {
  document.querySelectorAll(".cg-cards-grid").forEach(grid => grid.classList.remove("active"));
  document.querySelectorAll(".cg-tab-btn").forEach(btn => btn.classList.remove("active"));
  
  renderCards(tabId);
  updateBackgroundImages();
  
  document.getElementById("tab" + tabId).classList.add("active");
  event.target.classList.add("active");
}

document.addEventListener('DOMContentLoaded', function() {
  // Render all tabs
  renderCards(1);
  renderCards(2);
  renderCards(3);
  
  // Update background images based on screen size
  updateBackgroundImages();
  
  // Preload Tab2 and Tab3 images after 1.5s
  setTimeout(() => {
    const preloadImages = (tabId) => {
      document.querySelectorAll(`#tab${tabId} .cg-card-image-container`).forEach(container => {
        const bgImage = window.getComputedStyle(container).backgroundImage;
        if (bgImage && bgImage !== 'none') {
          const preloader = new Image();
          preloader.src = bgImage.slice(5, -2); // Extract URL from url('...')
        }
        
        const mobileImage = container.dataset.mobile;
        if (mobileImage) {
          const preloader = new Image();
          preloader.src = mobileImage;
        }
      });
    };

    preloadImages(2);
    preloadImages(3);
  }, 1500);
  
  // Handle window resize for responsive images
  window.addEventListener('resize', updateBackgroundImages);
});
