<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Fondos Animados — Laboratorio Visual (Light)</title>
    <style>
        :root {
            --bg: #f8f7fc;
            --surface: #ffffff;
            --surface2: #f3f1fa;
            --border: #e2dfee;
            --border-glow: #c5bfe0;
            --text: #2a2638;
            --text-dim: #6e6880;
            --accent: #6c4cf0;
            --accent2: #2ea5d4;
            --accent3: #d42e8c;
            --radius: 16px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(108, 76, 240, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 30%, rgba(46, 165, 212, 0.03) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 70%, rgba(212, 46, 140, 0.03) 0%, transparent 55%);
            background-attachment: fixed;
        }

        .gallery-header {
            text-align: center;
            padding: 60px 20px 30px;
            position: relative;
            z-index: 1;
        }
        .gallery-header .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(108, 76, 240, 0.08);
            border: 1px solid rgba(108, 76, 240, 0.2);
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .gallery-header h1 {
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #3a3060 0%, #5a4a90 40%, #2a2048 70%, #3a3060 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .gallery-header .subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 0.04em;
            font-weight: 400;
        }
        .gallery-header .line {
            width: 60px;
            height: 2px;
            background: var(--accent);
            margin: 16px auto;
            border-radius: 2px;
            opacity: 0.5;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
            gap: 28px;
            padding: 20px 28px 60px;
            max-width: 1500px;
            margin: 0 auto;
        }
        @media (max-width: 520px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                padding: 12px 14px 40px;
                gap: 18px;
            }
        }

        .effect-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 12px rgba(100, 90, 140, 0.06);
        }
        .effect-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 0 40px rgba(108, 76, 240, 0.08), 0 8px 32px rgba(80, 60, 130, 0.1);
        }
        .effect-card .card-visual {
            position: relative;
            width: 100%;
            height: 300px;
            background: var(--surface2);
            overflow: hidden;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .effect-card .card-visual canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .effect-card .card-info {
            padding: 18px 20px 20px;
        }
        .effect-card .card-info .index {
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .effect-card .card-info h3 {
            font-size: 1.15rem;
            font-weight: 650;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            color: #1e1a2c;
        }
        .effect-card .card-info p {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d8d4e8;
            border-radius: 3px;
        }

        .gallery-footer {
            text-align: center;
            padding: 20px 20px 50px;
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <header class="gallery-header">
        <div class="badge">Laboratorio de Fondos · 20 Efectos</div>
        <h1>Galería de Fondos Animados</h1>
        <div class="line"></div>
        <p class="subtitle">Efectos generativos autónomos — sin interacción, solo movimiento puro</p>
    </header>

    <main class="gallery-grid" id="galleryGrid"></main>

    <footer class="gallery-footer">
        HTML · CSS · JavaScript Vanilla — 20 fondos vivos — Tema Claro
    </footer>

    <script>
        (function() {
            const effectDefs = [
                { id: 1, title: 'Ondas Suaves', desc: 'Capas de ondas sinusoidales que se desplazan lateralmente con transparencias pastel.' },
                { id: 2, title: 'Gradiente Radial Pulsante', desc: 'Un gradiente circular que respira expandiendo y contrayendo suavemente su luz central.' },
                { id: 3, title: 'Partículas de Polvo Flotante', desc: 'Miles de partículas diminutas suspendidas que derivan lentamente en un flujo etéreo.' },
                { id: 4, title: 'Mosaico Hexagonal', desc: 'Patrón de hexágonos cuyos colores oscilan lentamente creando un tapiz dinámico.' },
                { id: 5, title: 'Burbujas Ascendentes', desc: 'Esferas translúcidas que suben y se balancean como burbujas en un líquido.' },
                { id: 6, title: 'Lluvia de Símbolos', desc: 'Caracteres y runas que caen en cascada con un ritmo pausado y tipografía fina.' },
                { id: 7, title: 'Nubes Procedurales', desc: 'Ruido orgánico multicapa que simula formaciones nubosas en evolución constante.' },
                { id: 8, title: 'Anillos Concéntricos', desc: 'Círculos que se expanden desde el centro creando un hipnótico efecto de gota de agua.' },
                { id: 9, title: 'Campo de Flujo Suave', desc: 'Líneas curvas que serpentean siguiendo un campo vectorial generado por ruido procedural.' },
                { id: 10, title: 'Aurora Boreal', desc: 'Bandas horizontales de color que ondulan como una aurora en cámara lenta.' },
                { id: 11, title: 'Estrellas Titilantes', desc: 'Cielo estrellado con puntos que brillan y se atenúan a diferentes frecuencias.' },
                { id: 12, title: 'Ondas de Calor', desc: 'Distorsión vertical similar al aire caliente subiendo, con franjas temblorosas.' },
                { id: 13, title: 'Geometría Rotante', desc: 'Polígono regular que gira suavemente mientras su silueta se transforma.' },
                { id: 14, title: 'Lluvia Cromática', desc: 'Gotas de tinta de colores que caen lentamente y se difuminan en el fondo.' },
                { id: 15, title: 'Acuarela Digital', desc: 'Manchas de color que se mezclan y desplazan como pigmentos sobre papel mojado.' },
                { id: 16, title: 'Persianas Verticales', desc: 'Franjas verticales que se desplazan horizontalmente creando un ritmo visual.' },
                { id: 17, title: 'Espiral Generativa', desc: 'Una espiral logarítmica que crece y rota continuamente desde el centro.' },
                { id: 18, title: 'Ruido Pastel', desc: 'Ruido de Perlin suavizado y mapeado a una paleta de colores pastel apacibles.' },
                { id: 19, title: 'Malla Deformable', desc: 'Cuadrícula cuyos nodos oscilan independientemente creando una red elástica.' },
                { id: 20, title: 'Niebla Flotante', desc: 'Nubes de niebla baja que se deslizan horizontalmente a distintas velocidades.' },
            ];

            const grid = document.getElementById('galleryGrid');
            effectDefs.forEach((def) => {
                const card = document.createElement('div');
                card.className = 'effect-card';
                card.setAttribute('data-effect-id', def.id);
                card.innerHTML = `
                    <div class="card-visual" id="visual-${def.id}"></div>
                    <div class="card-info">
                        <div class="index">Fondo ${String(def.id).padStart(2,'0')}</div>
                        <h3>${def.title}</h3>
                        <p>${def.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            const effectInstances = {};

            // ─── CLASE BASE PARA EFECTOS DE FONDO ──────────────────
            class BackgroundEffect {
                constructor(containerId, effectId) {
                    this.container = document.getElementById(containerId);
                    this.effectId = effectId;
                    this.canvas = document.createElement('canvas');
                    this.canvas.style.display = 'block';
                    this.canvas.style.width = '100%';
                    this.canvas.style.height = '100%';
                    this.container.appendChild(this.canvas);
                    this.ctx = this.canvas.getContext('2d');
                    this.width = 0;
                    this.height = 0;
                    this.animId = null;
                    this.running = true;
                    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
                    this._resize();
                    this._bindResize();
                }
                _resize() {
                    const rect = this.container.getBoundingClientRect();
                    this.width = rect.width;
                    this.height = rect.height;
                    this.canvas.width = rect.width * this.dpr;
                    this.canvas.height = rect.height * this.dpr;
                    this.canvas.style.width = rect.width + 'px';
                    this.canvas.style.height = rect.height + 'px';
                    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                }
                _bindResize() {
                    this._resizeHandler = () => this._resize();
                    window.addEventListener('resize', this._resizeHandler);
                }
                update(dt) {}
                draw(ctx, w, h) {}
                start() {
                    let lastTime = performance.now();
                    const loop = (time) => {
                        if (!this.running) return;
                        const dt = Math.min((time - lastTime) / 1000, 0.1);
                        lastTime = time;
                        this.update(dt);
                        this.ctx.clearRect(0, 0, this.width, this.height);
                        this.draw(this.ctx, this.width, this.height);
                        this.animId = requestAnimationFrame(loop);
                    };
                    this.animId = requestAnimationFrame(loop);
                }
                destroy() {
                    this.running = false;
                    if (this.animId) cancelAnimationFrame(this.animId);
                    window.removeEventListener('resize', this._resizeHandler);
                    if (this.canvas.parentNode) this.canvas.parentNode.removeChild(this.canvas);
                }
            }

            // ─── EFECTO 1: Ondas Suaves ──────────────────────────
            class Bg01_Ondas extends BackgroundEffect {
                constructor() { super('visual-1', 1);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fe';
                    ctx.fillRect(0, 0, w, h);
                    const layers = [
                        { yBase: h * 0.3, amp: 40, freq: 0.012, speed: 0.4, color: 'rgba(130,100,210,0.18)', w: 2 },
                        { yBase: h * 0.5, amp: 55, freq: 0.008, speed: 0.55, color: 'rgba(100,140,200,0.16)', w: 2.5 },
                        { yBase: h * 0.7, amp: 35, freq: 0.015, speed: 0.65, color: 'rgba(160,120,190,0.15)', w: 1.8 },
                    ];
                    for (const l of layers) {
                        ctx.strokeStyle = l.color;
                        ctx.lineWidth = l.w;
                        ctx.beginPath();
                        for (let x = 0; x <= w; x += 4) {
                            const y = l.yBase + Math.sin(x * l.freq + this.time * l.speed) * l.amp + Math.sin(x * l.freq *
                                1.6 + this.time * l.speed * 0.7) * l.amp * 0.4;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }
                }
            }

            // ─── EFECTO 2: Gradiente Radial Pulsante ──────────────
            class Bg02_Pulso extends BackgroundEffect {
                constructor() { super('visual-2', 2);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    const cx = w / 2,
                        cy = h / 2;
                    const r = Math.min(w, h) * 0.35 + Math.sin(this.time * 1.3) * 40 + Math.sin(this.time * 2.1) * 25;
                    const grad = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
                    grad.addColorStop(0, 'rgba(140,110,230,0.25)');
                    grad.addColorStop(0.5, 'rgba(120,150,220,0.1)');
                    grad.addColorStop(1, 'rgba(250,248,255,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, w, h);
                    const grad2 = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.5);
                    grad2.addColorStop(0, 'rgba(200,180,240,0.18)');
                    grad2.addColorStop(1, 'rgba(250,248,255,0)');
                    ctx.fillStyle = grad2;
                    ctx.fillRect(0, 0, w, h);
                }
            }

            // ─── EFECTO 3: Partículas de Polvo Flotante ──────────
            class Bg03_Polvo extends BackgroundEffect {
                constructor() {
                    super('visual-3', 3);
                    this.particles = [];
                    this.time = 0;
                    for (let i = 0; i < 120; i++) {
                        this.particles.push({
                            x: Math.random() * 600,
                            y: Math.random() * 400,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 3,
                            size: 0.4 + Math.random() * 1.4,
                            alpha: 0.2 + Math.random() * 0.4,
                        });
                    }
                    this.start();
                }
                update(dt) {
                    this.time += dt;
                    for (const p of this.particles) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.x += Math.sin(this.time * 0.7 + p.y * 0.03) * 2 * dt;
                        p.y += Math.cos(this.time * 0.6 + p.x * 0.02) * 1.5 * dt;
                        if (p.x < -20) p.x = this.width + 20;
                        if (p.x > this.width + 20) p.x = -20;
                        if (p.y < -20) p.y = this.height + 20;
                        if (p.y > this.height + 20) p.y = -20;
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fdfdfe';
                    ctx.fillRect(0, 0, w, h);
                    for (const p of this.particles) {
                        ctx.fillStyle = `rgba(120,100,170,${p.alpha})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 4: Mosaico Hexagonal ─────────────────────
            class Bg04_Hexagonos extends BackgroundEffect {
                constructor() { super('visual-4', 4);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fcfbfe';
                    ctx.fillRect(0, 0, w, h);
                    const size = 28;
                    const hexH = size * Math.sqrt(3);
                    const cols = Math.ceil(w / (size * 1.5)) + 1;
                    const rows = Math.ceil(h / hexH) + 1;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const cx = c * size * 1.5;
                            const cy = r * hexH + (c % 2 === 0 ? 0 : hexH / 2);
                            const hue = 240 + Math.sin(cx * 0.008 + this.time * 0.4) * 30 + Math.cos(cy * 0.009 + this.time *
                                0.35) * 25;
                            const lightness = 72 + Math.sin(cx * 0.015 + cy * 0.012 + this.time * 0.5) * 10;
                            ctx.fillStyle = `hsl(${hue},40%,${lightness}%)`;
                            ctx.beginPath();
                            for (let i = 0; i < 6; i++) {
                                const angle = Math.PI / 6 + (Math.PI / 3) * i;
                                const x = cx + Math.cos(angle) * size;
                                const y = cy + Math.sin(angle) * size;
                                if (i === 0) ctx.moveTo(x, y);
                                else ctx.lineTo(x, y);
                            }
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                }
            }

            // ─── EFECTO 5: Burbujas Ascendentes ──────────────────
            class Bg05_Burbujas extends BackgroundEffect {
                constructor() {
                    super('visual-5', 5);
                    this.bubbles = [];
                    for (let i = 0; i < 35; i++) {
                        this.bubbles.push({
                            x: Math.random() * 600,
                            y: Math.random() * 400,
                            r: 6 + Math.random() * 22,
                            speed: 8 + Math.random() * 25,
                            wobble: Math.random() * Math.PI * 2,
                            alpha: 0.15 + Math.random() * 0.3,
                        });
                    }
                    this.start();
                }
                update(dt) {
                    for (const b of this.bubbles) {
                        b.y -= b.speed * dt;
                        b.wobble += dt * 1.5;
                        b.x += Math.sin(b.wobble) * 6 * dt;
                        if (b.y < -b.r * 2) {
                            b.y = this.height + b.r * 2;
                            b.x = Math.random() * this.width;
                        }
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fd';
                    ctx.fillRect(0, 0, w, h);
                    for (const b of this.bubbles) {
                        const grad = ctx.createRadialGradient(b.x, b.y, b.r * 0.2, b.x, b.y, b.r);
                        grad.addColorStop(0, `rgba(170,150,220,${b.alpha*1.3})`);
                        grad.addColorStop(0.6, `rgba(140,120,200,${b.alpha*0.6})`);
                        grad.addColorStop(1, 'rgba(200,180,230,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 6: Lluvia de Símbolos ────────────────────
            class Bg06_Simbolos extends BackgroundEffect {
                constructor() {
                    super('visual-6', 6);
                    this.columns = [];
                    this.chars = '✦✧✶✷✸✹✺✻✼✽✾✿❀❁❂❃❄❅❆❇❈❉❊❋●○◎◉◌◍◐◑◒◓◔◕◖◗❖☙❦❧✿';
                    this._init();
                    this.start();
                }
                _init() {
                    const colW = 18;
                    const cols = Math.ceil((this.width || 500) / colW);
                    this.columns = [];
                    for (let i = 0; i < cols; i++) {
                        this.columns.push({
                            x: i * colW,
                            y: Math.random() * -400,
                            speed: 15 + Math.random() * 45,
                            len: 4 + Math.floor(Math.random() * 14),
                        });
                    }
                }
                _resize() { super._resize();
                    this._init(); }
                update(dt) {
                    for (const c of this.columns) {
                        c.y += c.speed * dt;
                        if (c.y > (this.height || 350) + 80) { c.y = Math.random() * -200;
                            c.len = 4 + Math.floor(Math.random() * 14); }
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = 'rgba(252,251,254,0.2)';
                    ctx.fillRect(0, 0, w, h);
                    ctx.font = '13px ' + getComputedStyle(document.body).fontFamily;
                    ctx.textAlign = 'center';
                    for (const col of this.columns) {
                        for (let j = 0; j < col.len; j++) {
                            const cy = col.y - j * 20;
                            if (cy < -15 || cy > h + 15) continue;
                            const alpha = j === 0 ? 0.7 : Math.max(0.04, 1 - j / col.len) * 0.5;
                            ctx.fillStyle = `rgba(90,60,150,${alpha})`;
                            const ch = this.chars[Math.floor(Math.random() * this.chars.length)];
                            ctx.fillText(ch, col.x, cy);
                        }
                    }
                }
            }

            // ─── EFECTO 7: Nubes Procedurales ────────────────────
            class Bg07_Nubes extends BackgroundEffect {
                constructor() { super('visual-7', 7);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                noise(x, y) {
                    const t = this.time * 0.15;
                    return Math.sin(x * 0.012 + t) * Math.cos(y * 0.01 + t * 0.7) +
                        Math.sin(x * 0.022 - y * 0.014 + t * 1.2) * 0.6 +
                        Math.cos(x * 0.008 + y * 0.018 - t * 0.8) * 0.4;
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fe';
                    ctx.fillRect(0, 0, w, h);
                    const cell = 14;
                    const cols = Math.ceil(w / cell);
                    const rows = Math.ceil(h / cell);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const val = this.noise(c * cell, r * cell);
                            const alpha = Math.max(0, Math.min(1, val * 0.35 + 0.08));
                            const lightness = 82 - alpha * 50;
                            ctx.fillStyle = `hsla(250,30%,${lightness}%,${alpha})`;
                            ctx.fillRect(c * cell, r * cell, cell + 1, cell + 1);
                        }
                    }
                }
            }

            // ─── EFECTO 8: Anillos Concéntricos ──────────────────
            class Bg08_Anillos extends BackgroundEffect {
                constructor() { super('visual-8', 8);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fdfcfe';
                    ctx.fillRect(0, 0, w, h);
                    const cx = w / 2,
                        cy = h / 2;
                    const maxR = Math.sqrt(cx * cx + cy * cy) + 30;
                    const base = (this.time * 50) % 120;
                    for (let i = 0; i < 18; i++) {
                        const r = base + i * 55;
                        if (r > maxR || r < 2) continue;
                        const alpha = 0.08 + (1 - r / maxR) * 0.3;
                        ctx.strokeStyle = `rgba(100,80,170,${alpha})`;
                        ctx.lineWidth = 1.2 + (1 - r / maxR) * 2;
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }

            // ─── EFECTO 9: Campo de Flujo Suave ──────────────────
            class Bg09_Flujo extends BackgroundEffect {
                constructor() {
                    super('visual-9', 9);
                    this.time = 0;
                    this.particles = [];
                    for (let i = 0; i < 60; i++) {
                        this.particles.push({
                            x: Math.random() * 600,
                            y: Math.random() * 400,
                            life: Math.random() * 100,
                        });
                    }
                    this.start();
                }
                update(dt) {
                    this.time += dt;
                    for (const p of this.particles) {
                        const angle = Math.sin(p.y * 0.02 + this.time * 0.5) * 0.8 + Math.cos(p.x * 0.018 + this.time * 0.4) *
                            0.5;
                        p.x += Math.cos(angle) * 25 * dt;
                        p.y += Math.sin(angle) * 25 * dt;
                        p.life -= dt * 12;
                        if (p.life <= 0 || p.x < -20 || p.x > this.width + 20 || p.y < -20 || p.y > this.height + 20) {
                            p.x = Math.random() * this.width;
                            p.y = Math.random() * this.height;
                            p.life = 40 + Math.random() * 70;
                        }
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = 'rgba(252,251,254,0.25)';
                    ctx.fillRect(0, 0, w, h);
                    ctx.strokeStyle = 'rgba(110,90,180,0.35)';
                    ctx.lineWidth = 0.7;
                    for (const p of this.particles) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
            }

            // ─── EFECTO 10: Aurora Boreal ────────────────────────
            class Bg10_Aurora extends BackgroundEffect {
                constructor() { super('visual-10', 10);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#f8f7fc';
                    ctx.fillRect(0, 0, w, h);
                    const bands = [
                        { y: h * 0.35, amp: 45, f: 0.007, s: 0.35, hue: 170 },
                        { y: h * 0.42, amp: 35, f: 0.009, s: 0.5, hue: 190 },
                        { y: h * 0.3, amp: 55, f: 0.0055, s: 0.3, hue: 210 },
                    ];
                    for (const b of bands) {
                        ctx.beginPath();
                        ctx.moveTo(0, b.y);
                        for (let x = 0; x <= w; x += 3) {
                            const y = b.y + Math.sin(x * b.f + this.time * b.s) * b.amp + Math.sin(x * b.f * 1.7 + this.time *
                                b.s * 0.8) * b.amp * 0.5;
                            ctx.lineTo(x, y);
                        }
                        ctx.lineTo(w, h);
                        ctx.lineTo(0, h);
                        ctx.closePath();
                        const grad = ctx.createLinearGradient(0, b.y - b.amp, 0, b.y + b.amp * 2);
                        grad.addColorStop(0, `hsla(${b.hue},70%,55%,0.35)`);
                        grad.addColorStop(0.6, `hsla(${b.hue+15},60%,50%,0.12)`);
                        grad.addColorStop(1, 'transparent');
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 11: Estrellas Titilantes ─────────────────
            class Bg11_Estrellas extends BackgroundEffect {
                constructor() {
                    super('visual-11', 11);
                    this.stars = [];
                    for (let i = 0; i < 90; i++) {
                        this.stars.push({
                            x: Math.random() * 600,
                            y: Math.random() * 400,
                            r: 0.3 + Math.random() * 1.6,
                            phase: Math.random() * Math.PI * 2,
                            freq: 0.5 + Math.random() * 2.5,
                        });
                    }
                    this.time = 0;
                    this.start();
                }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fdfdfe';
                    ctx.fillRect(0, 0, w, h);
                    for (const s of this.stars) {
                        const alpha = 0.15 + Math.sin(this.time * s.freq + s.phase) * 0.2 + 0.2;
                        ctx.fillStyle = `rgba(70,50,120,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 12: Ondas de Calor ───────────────────────
            class Bg12_Calor extends BackgroundEffect {
                constructor() { super('visual-12', 12);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fd';
                    ctx.fillRect(0, 0, w, h);
                    const cols = 12;
                    const colW = w / cols;
                    for (let c = 0; c < cols; c++) {
                        const x = c * colW + colW / 2;
                        ctx.strokeStyle = 'rgba(150,130,200,0.22)';
                        ctx.lineWidth = colW * 0.7;
                        ctx.beginPath();
                        for (let y = 0; y <= h; y += 5) {
                            const offset = Math.sin(y * 0.04 + this.time * 2.5 + c * 1.2) * 12 + Math.sin(y * 0.07 + this.time *
                                1.8) * 8;
                            if (y === 0) ctx.moveTo(x + offset, y);
                            else ctx.lineTo(x + offset, y);
                        }
                        ctx.stroke();
                    }
                }
            }

            // ─── EFECTO 13: Geometría Rotante ────────────────────
            class Bg13_Geometria extends BackgroundEffect {
                constructor() { super('visual-13', 13);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fcfbfe';
                    ctx.fillRect(0, 0, w, h);
                    const cx = w / 2,
                        cy = h / 2;
                    const sides = 6;
                    const r = Math.min(w, h) * 0.32;
                    const angleOffset = this.time * 0.4;
                    ctx.strokeStyle = 'rgba(110,80,190,0.5)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    for (let i = 0; i <= sides; i++) {
                        const angle = angleOffset + (Math.PI * 2 / sides) * i;
                        const x = cx + Math.cos(angle) * r;
                        const y = cy + Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                    grad.addColorStop(0, 'rgba(150,130,220,0.1)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fill();
                }
            }

            // ─── EFECTO 14: Lluvia Cromática ─────────────────────
            class Bg14_Cromatica extends BackgroundEffect {
                constructor() {
                    super('visual-14', 14);
                    this.drops = [];
                    for (let i = 0; i < 25; i++) {
                        this.drops.push(this._newDrop());
                    }
                    this.start();
                }
                _newDrop() {
                    return {
                        x: Math.random() * 600,
                        y: Math.random() * -300,
                        r: 4 + Math.random() * 12,
                        speed: 20 + Math.random() * 50,
                        hue: Math.random() * 360,
                        alpha: 0.3 + Math.random() * 0.4,
                    };
                }
                update(dt) {
                    for (const d of this.drops) {
                        d.y += d.speed * dt;
                        if (d.y > this.height + 40) {
                            Object.assign(d, this._newDrop());
                            d.y = -40;
                        }
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = 'rgba(250,249,254,0.3)';
                    ctx.fillRect(0, 0, w, h);
                    for (const d of this.drops) {
                        const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 2);
                        grad.addColorStop(0, `hsla(${d.hue},65%,55%,${d.alpha})`);
                        grad.addColorStop(1, 'transparent');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.r * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 15: Acuarela Digital ─────────────────────
            class Bg15_Acuarela extends BackgroundEffect {
                constructor() {
                    super('visual-15', 15);
                    this.blobs = [];
                    for (let i = 0; i < 14; i++) {
                        this.blobs.push({
                            x: Math.random() * 600,
                            y: Math.random() * 400,
                            vx: (Math.random() - 0.5) * 15,
                            vy: (Math.random() - 0.5) * 10,
                            r: 35 + Math.random() * 60,
                            hue: 200 + Math.random() * 160,
                            alpha: 0.12 + Math.random() * 0.2,
                        });
                    }
                    this.start();
                }
                update(dt) {
                    for (const b of this.blobs) {
                        b.x += b.vx * dt;
                        b.y += b.vy * dt;
                        b.vx += (Math.random() - 0.5) * 8 * dt;
                        b.vy += (Math.random() - 0.5) * 6 * dt;
                        b.vx *= 0.998;
                        b.vy *= 0.998;
                        if (b.x < -60) b.x = this.width + 60;
                        if (b.x > this.width + 60) b.x = -60;
                        if (b.y < -60) b.y = this.height + 60;
                        if (b.y > this.height + 60) b.y = -60;
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fbfafe';
                    ctx.fillRect(0, 0, w, h);
                    for (const b of this.blobs) {
                        const grad = ctx.createRadialGradient(b.x, b.y, b.r * 0.3, b.x, b.y, b.r);
                        grad.addColorStop(0, `hsla(${b.hue},55%,65%,${b.alpha})`);
                        grad.addColorStop(0.7, `hsla(${b.hue},45%,60%,${b.alpha*0.4})`);
                        grad.addColorStop(1, 'transparent');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── EFECTO 16: Persianas Verticales ─────────────────
            class Bg16_Persianas extends BackgroundEffect {
                constructor() { super('visual-16', 16);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fdfdfe';
                    ctx.fillRect(0, 0, w, h);
                    const bw = 35;
                    const cols = Math.ceil(w / bw) + 1;
                    const offset = (this.time * 25) % (bw * 2);
                    for (let c = -1; c < cols; c++) {
                        const x = c * bw + offset;
                        const alpha = 0.06 + Math.abs(Math.sin(c * 0.5 + this.time * 0.3)) * 0.1;
                        ctx.fillStyle = `rgba(100,80,170,${alpha})`;
                        ctx.fillRect(x, 0, bw * 0.55, h);
                    }
                }
            }

            // ─── EFECTO 17: Espiral Generativa ───────────────────
            class Bg17_Espiral extends BackgroundEffect {
                constructor() { super('visual-17', 17);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fe';
                    ctx.fillRect(0, 0, w, h);
                    const cx = w / 2,
                        cy = h / 2;
                    const turns = 6;
                    const maxR = Math.min(w, h) * 0.45;
                    ctx.strokeStyle = 'rgba(120,90,190,0.4)';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    for (let i = 0; i <= 600; i++) {
                        const t = i / 600;
                        const angle = t * Math.PI * 2 * turns + this.time * 0.6;
                        const r = t * maxR;
                        const x = cx + Math.cos(angle) * r;
                        const y = cy + Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }

            // ─── EFECTO 18: Ruido Pastel ─────────────────────────
            class Bg18_RuidoPastel extends BackgroundEffect {
                constructor() { super('visual-18', 18);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                noiseVal(x, y) {
                    const t = this.time * 0.25;
                    return Math.sin(x * 0.015 + t) * Math.cos(y * 0.013 + t * 0.8) * 0.5 +
                        Math.sin(x * 0.025 - y * 0.018 + t * 1.1) * 0.35 +
                        Math.cos(x * 0.01 + y * 0.02 - t * 0.7) * 0.3;
                }
                draw(ctx, w, h) {
                    const cell = 8;
                    const cols = Math.ceil(w / cell);
                    const rows = Math.ceil(h / cell);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const val = this.noiseVal(c * cell, r * cell);
                            const hue = 240 + val * 60;
                            const lightness = 75 + val * 18;
                            ctx.fillStyle = `hsl(${hue},35%,${lightness}%)`;
                            ctx.fillRect(c * cell, r * cell, cell + 1, cell + 1);
                        }
                    }
                }
            }

            // ─── EFECTO 19: Malla Deformable ─────────────────────
            class Bg19_Malla extends BackgroundEffect {
                constructor() { super('visual-19', 19);
                    this.time = 0;
                    this.start(); }
                update(dt) { this.time += dt; }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#fcfbfe';
                    ctx.fillRect(0, 0, w, h);
                    const spacing = 40;
                    const cols = Math.ceil(w / spacing) + 1;
                    const rows = Math.ceil(h / spacing) + 1;
                    const nodes = [];
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const bx = c * spacing;
                            const by = r * spacing;
                            const dx = Math.sin(by * 0.03 + this.time * 0.7 + c * 0.4) * 10 + Math.cos(bx * 0.025 + this.time *
                                0.5) * 8;
                            const dy = Math.cos(bx * 0.028 + this.time * 0.6 + r * 0.5) * 10 + Math.sin(by * 0.032 + this.time *
                                0.8) * 7;
                            nodes.push({ x: bx + dx, y: by + dy });
                        }
                    }
                    ctx.strokeStyle = 'rgba(110,90,170,0.3)';
                    ctx.lineWidth = 0.6;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const idx = r * cols + c;
                            const n = nodes[idx];
                            if (c < cols - 1) {
                                const right = nodes[idx + 1];
                                ctx.beginPath();
                                ctx.moveTo(n.x, n.y);
                                ctx.lineTo(right.x, right.y);
                                ctx.stroke();
                            }
                            if (r < rows - 1) {
                                const bottom = nodes[(r + 1) * cols + c];
                                ctx.beginPath();
                                ctx.moveTo(n.x, n.y);
                                ctx.lineTo(bottom.x, bottom.y);
                                ctx.stroke();
                            }
                        }
                    }
                }
            }

            // ─── EFECTO 20: Niebla Flotante ──────────────────────
            class Bg20_Niebla extends BackgroundEffect {
                constructor() {
                    super('visual-20', 20);
                    this.clouds = [];
                    for (let i = 0; i < 18; i++) {
                        this.clouds.push({
                            x: Math.random() * 700,
                            y: Math.random() * 400,
                            r: 40 + Math.random() * 90,
                            speed: 3 + Math.random() * 12,
                            alpha: 0.08 + Math.random() * 0.18,
                        });
                    }
                    this.start();
                }
                update(dt) {
                    for (const c of this.clouds) {
                        c.x += c.speed * dt;
                        c.y += Math.sin(c.x * 0.005) * 5 * dt;
                        if (c.x > this.width + 120) c.x = -120;
                    }
                }
                draw(ctx, w, h) {
                    ctx.fillStyle = '#faf9fd';
                    ctx.fillRect(0, 0, w, h);
                    for (const c of this.clouds) {
                        const grad = ctx.createRadialGradient(c.x, c.y, c.r * 0.2, c.x, c.y, c.r);
                        grad.addColorStop(0, `rgba(170,165,195,${c.alpha})`);
                        grad.addColorStop(0.7, `rgba(160,155,185,${c.alpha*0.4})`);
                        grad.addColorStop(1, 'transparent');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ─── MAPA DE CONSTRUCTORES ──────────────────────────
            const constructors = {
                1: Bg01_Ondas,
                2: Bg02_Pulso,
                3: Bg03_Polvo,
                4: Bg04_Hexagonos,
                5: Bg05_Burbujas,
                6: Bg06_Simbolos,
                7: Bg07_Nubes,
                8: Bg08_Anillos,
                9: Bg09_Flujo,
                10: Bg10_Aurora,
                11: Bg11_Estrellas,
                12: Bg12_Calor,
                13: Bg13_Geometria,
                14: Bg14_Cromatica,
                15: Bg15_Acuarela,
                16: Bg16_Persianas,
                17: Bg17_Espiral,
                18: Bg18_RuidoPastel,
                19: Bg19_Malla,
                20: Bg20_Niebla,
            };

            // ─── INTERSECTION OBSERVER ──────────────────────────
            const loaded = new Set();
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        const effectId = parseInt(card.getAttribute('data-effect-id'));
                        if (!loaded.has(effectId)) {
                            loaded.add(effectId);
                            const Ctor = constructors[effectId];
                            if (Ctor) effectInstances[effectId] = new Ctor();
                        }
                    }
                });
            }, { rootMargin: '200px', threshold: 0.05 });

            document.querySelectorAll('.effect-card').forEach((card) => observer.observe(card));

            console.log('%c🎨 20 Fondos Animados inicializados %c| %cTema Claro',
                'color:#6c4cf0;font-size:1.1em;', '', 'color:#888;');
        })();
    </script>
</body>
