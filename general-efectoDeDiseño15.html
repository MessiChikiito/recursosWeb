<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Fracture Portal</title>
    <style>
        :root {
            --bg: #000010;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            cursor: crosshair;
            -webkit-user-select: none;
            user-select: none;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* Vignette overlay */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 50%,
                    rgba(0, 0, 10, 0.4) 70%,
                    rgba(0, 0, 8, 0.8) 90%,
                    rgba(0, 0, 5, 0.95) 100%);
            mix-blend-mode: multiply;
        }

        /* Chromatic fringe overlay - subtle static aberration */
        .chromatic-fringe {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.25;
            background: radial-gradient(ellipse at center,
                    transparent 30%,
                    rgba(255, 40, 40, 0.06) 50%,
                    transparent 52%,
                    rgba(40, 40, 255, 0.06) 55%,
                    transparent 57%,
                    rgba(40, 255, 255, 0.04) 60%,
                    transparent 70%);
            animation: chromaticPulse 3s ease-in-out infinite;
        }

        @keyframes chromaticPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(1.03);
            }
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
            opacity: 0.5;
        }

        /* Hero text */
        .hero-text {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
        }

        .hero-title {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            letter-spacing: 0.35em;
            color: rgba(200, 210, 240, 0.85);
            text-shadow:
                0 0 40px rgba(140, 160, 220, 0.6),
                0 0 80px rgba(100, 140, 220, 0.3),
                0 0 120px rgba(60, 100, 200, 0.2),
                0 2px 4px rgba(0, 0, 0, 0.8);
            font-weight: normal;
            text-transform: uppercase;
            animation: textBreathe 4s ease-in-out infinite;
        }

        .hero-subtitle {
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            letter-spacing: 0.5em;
            color: rgba(160, 175, 210, 0.6);
            text-shadow: 0 0 20px rgba(100, 140, 200, 0.4);
            margin-top: 0.5em;
            text-transform: uppercase;
            animation: textBreathe 4s ease-in-out 1s infinite;
        }

        @keyframes textBreathe {
            0%,
            100% {
                opacity: 0.75;
            }
            50% {
                opacity: 1;
            }
        }

        /* Particle disturbance hint */
        .cursor-glow {
            position: fixed;
            pointer-events: none;
            z-index: 6;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(180, 200, 255, 0.15) 0%,
                    rgba(100, 140, 220, 0.05) 40%,
                    transparent 70%);
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="vignette"></div>
    <div class="chromatic-fringe"></div>
    <div class="scanlines"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="hero-text">
        <div class="hero-title">Reality Fracture Portal</div>
        <div class="hero-subtitle">Dimensional Rift Active</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // ─────────────────────────────────────
        // DOM ELEMENTS
        // ─────────────────────────────────────
        const container = document.getElementById('canvas-container');
        const cursorGlow = document.getElementById('cursor-glow');

        // ─────────────────────────────────────
        // SCENE SETUP
        // ─────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(0, 0.15, 4.2);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.domElement.style.display = 'block';
        container.appendChild(renderer.domElement);

        // ─────────────────────────────────────
        // TEXTURE GENERATORS
        // ─────────────────────────────────────
        function createGlowTexture(innerColor, outerColor, size = 256) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const half = size / 2;
            const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
            gradient.addColorStop(0, innerColor);
            gradient.addColorStop(0.15, innerColor);
            gradient.addColorStop(0.5, outerColor);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }

        function createSoftParticleTexture(size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const half = size / 2;
            const gradient = ctx.createRadialGradient(half, half, 0, half, half, half);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.08, 'rgba(220,230,255,0.95)');
            gradient.addColorStop(0.3, 'rgba(140,170,240,0.6)');
            gradient.addColorStop(0.6, 'rgba(40,80,180,0.15)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }

        function createRayTexture(size = 512) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size;
            const gradient = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.95);
            gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.05, 'rgba(200,220,255,0.7)');
            gradient.addColorStop(0.2, 'rgba(120,160,240,0.35)');
            gradient.addColorStop(0.5, 'rgba(40,80,180,0.08)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return tex;
        }

        // Pre-generate textures
        const glowTexLarge = createGlowTexture('rgba(255,240,220,1)', 'rgba(180,140,80,0.4)', 512);
        const glowTexBlue = createGlowTexture('rgba(200,220,255,1)', 'rgba(40,80,180,0.5)', 512);
        const softParticleTex = createSoftPlayerTexture();
        const rayTex = createRayTexture();

        // ─────────────────────────────────────
        // LIGHTING (ambient only, most things are emissive)
        // ─────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x0a0a20, 0.3));

        // ─────────────────────────────────────
        // STARFIELD
        // ─────────────────────────────────────
        const starCount = 1200;
        const starGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);

        for (let i = 0; i < starCount; i++) {
            // Spherical distribution
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 8 + Math.random() * 25;
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);

            // Color: mostly blue-white, some warm
            const colorType = Math.random();
            if (colorType < 0.7) {
                starColors[i * 3] = 0.7 + Math.random() * 0.3;
                starColors[i * 3 + 1] = 0.75 + Math.random() * 0.25;
                starColors[i * 3 + 2] = 0.85 + Math.random() * 0.15;
            } else if (colorType < 0.9) {
                starColors[i * 3] = 0.9 + Math.random() * 0.1;
                starColors[i * 3 + 1] = 0.6 + Math.random() * 0.3;
                starColors[i * 3 + 2] = 0.4 + Math.random() * 0.3;
            } else {
                starColors[i * 3] = 0.5 + Math.random() * 0.3;
                starColors[i * 3 + 1] = 0.6 + Math.random() * 0.3;
                starColors[i * 3 + 2] = 0.9 + Math.random() * 0.1;
            }
            starSizes[i] = Math.random() * 2.5 + 0.3;
        }

        starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeom.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        starGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

        const starMat = new THREE.PointsMaterial({
            size: 0.04,
            map: softParticleTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.85,
        });

        const stars = new THREE.Points(starGeom, starMat);
        scene.add(stars);

        // ─────────────────────────────────────
        // PORTAL GROUP
        // ─────────────────────────────────────
        const portalGroup = new THREE.Group();
        scene.add(portalGroup);

        // ─────────────────────────────────────
        // PORTAL INTERIOR - Wormhole shader
        // ─────────────────────────────────────
        const portalInteriorGeom = new THREE.CircleGeometry(1.1, 80);
        const portalInteriorShader = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMouseDistortion: { value: new THREE.Vector2(0, 0) },
                uIntensity: { value: 1.0 },
            },
            vertexShader: /* glsl */ `
                varying vec2 vUv;
                varying vec3 vWorldPos;
                void main() {
                    vUv = uv;
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: /* glsl */ `
                varying vec2 vUv;
                varying vec3 vWorldPos;
                uniform float uTime;
                uniform vec2 uMouseDistortion;
                uniform float uIntensity;

                // Simple hash for grain
                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                }

                void main() {
                    vec2 centered = vUv - 0.5;
                    float r = length(centered);

                    // Discard outside circle
                    if (r > 0.5) discard;

                    float rNorm = r * 2.0;
                    float theta = atan(centered.y, centered.x);

                    // Mouse distortion affects the vortex
                    float distortAngle = uMouseDistortion.x * 0.4;
                    float distortRadial = uMouseDistortion.y * 0.15;
                    float rDistorted = rNorm + distortRadial * (1.0 - rNorm);
                    float thetaDistorted = theta + distortAngle * (1.0 - rNorm);

                    // Tunnel depth - creates false perspective
                    float depth = 1.0 / (rDistorted * 1.3 + 0.06);
                    float depthClamped = clamp(depth, 0.5, 8.0);

                    // Multi-layered spiral vortex
                    float spiral1 = sin(thetaDistorted * 7.0 + rDistorted * 22.0 - uTime * 2.8) * 0.5 + 0.5;
                    float spiral2 = cos(thetaDistorted * 5.0 - rDistorted * 17.0 + uTime * 2.1) * 0.5 + 0.5;
                    float spiral3 = sin(thetaDistorted * 9.0 + rDistorted * 28.0 + uTime * 3.3) * 0.5 + 0.5;
                    float spiral4 = cos(thetaDistorted * 3.0 - rDistorted * 12.0 - uTime * 1.6) * 0.5 + 0.5;

                    // Radial waves
                    float radWave1 = sin(rDistorted * 32.0 - uTime * 4.5) * 0.5 + 0.5;
                    float radWave2 = cos(rDistorted * 20.0 + uTime * 3.0) * 0.5 + 0.5;
                    float radWave3 = sin(rDistorted * 45.0 + uTime * 5.5) * 0.5 + 0.5;

                    // Combine patterns with weights
                    float pattern = spiral1 * 0.4 + spiral2 * 0.25 + spiral3 * 0.2 + spiral4 * 0.15;
                    pattern += radWave1 * 0.3 + radWave2 * 0.25 + radWave3 * 0.15;
                    pattern = pattern / 1.7;
                    pattern = clamp(pattern, 0.0, 1.0);

                    // High-frequency detail
                    float detail = sin(thetaDistorted * 18.0 + rDistorted * 55.0 - uTime * 6.0) * 0.5 + 0.5;
                    detail *= (1.0 - abs(rNorm - 0.4) * 2.5);
                    detail = clamp(detail, 0.0, 1.0);

                    // Color palette - other dimension
                    vec3 coreColor = vec3(0.92, 0.95, 1.0); // brilliant white-blue
                    vec3 innerGlow = vec3(0.3, 0.65, 1.0); // electric blue
                    vec3 midColor = vec3(0.15, 0.35, 0.9); // deep blue
                    vec3 outerColor = vec3(0.35, 0.06, 0.55); // deep violet
                    vec3 eventHorizon = vec3(0.05, 0.01, 0.15); // near-black purple
                    vec3 accentGold = vec3(1.0, 0.75, 0.25); // golden energy
                    vec3 accentCyan = vec3(0.2, 0.9, 0.95); // cyan flare

                    // Mix colors based on radius
                    float t1 = smoothstep(0.0, 0.2, rNorm);
                    float t2 = smoothstep(0.2, 0.55, rNorm);
                    float t3 = smoothstep(0.55, 0.85, rNorm);
                    float t4 = smoothstep(0.85, 1.0, rNorm);

                    vec3 color = mix(coreColor, innerGlow, t1);
                    color = mix(color, midColor, t2);
                    color = mix(color, outerColor, t3);
                    color = mix(color, eventHorizon, t4);

                    // Add pattern-driven accents
                    color += accentGold * pattern * 0.35 * (1.0 - rNorm) * uIntensity;
                    color += accentCyan * detail * 0.3 * (1.0 - abs(rNorm - 0.3) * 3.0);
                    color += accentGold * spiral3 * 0.2 * smoothstep(0.5, 0.0, rNorm);

                    // Brightness boost toward center
                    float brightness = 1.0 + depthClamped * 0.7;
                    color *= brightness;

                    // Event horizon darkening
                    float edgeFade = 1.0 - smoothstep(0.82, 1.0, rNorm);
                    edgeFade = pow(edgeFade, 0.7);
                    color *= edgeFade;

                    // Subtle grain
                    float grain = hash(centered * 150.0 + uTime * 0.1) * 0.04;
                    color += grain;

                    // Vignette inside portal
                    color *= 0.85 + 0.15 * (1.0 - rNorm);

                    // Ensure near-center is very bright
                    float coreBoost = exp(-rNorm * 8.0) * 1.5;
                    color += vec3(0.7, 0.8, 1.0) * coreBoost * 0.5;

                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            transparent: false,
            depthWrite: true,
            depthTest: true,
        });

        const portalInterior = new THREE.Mesh(portalInteriorGeom, portalInteriorShader);
        portalInterior.renderOrder = 1;
        portalGroup.add(portalInterior);

        // ─────────────────────────────────────
        // PORTAL RING - Torus with energy shader
        // ─────────────────────────────────────
        const torusGeom = new THREE.TorusGeometry(1.12, 0.07, 48, 160);
        const torusShader = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uIntensity: { value: 1.0 },
            },
            vertexShader: /* glsl */ `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vWorldPos;
                void main() {
                    vUv = uv;
                    vNormal = normalize(mat3(modelMatrix) * normal);
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: /* glsl */ `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vWorldPos;
                uniform float uTime;
                uniform float uIntensity;

                float hash1D(float n) {
                    return fract(sin(n) * 43758.5453123);
                }

                void main() {
                    // vUv.x goes around the ring, vUv.y goes around the tube
                    float ringPos = vUv.x;
                    float tubePos = vUv.y;

                    // Brightness variation along the ring
                    float variation = 1.0;
                    variation *= 0.65 + 0.35 * sin(ringPos * 25.0 + uTime * 1.7);
                    variation *= 0.7 + 0.3 * sin(ringPos * 13.0 - uTime * 2.3);
                    variation *= 0.75 + 0.25 * sin(ringPos * 7.0 + uTime * 0.9);
                    variation *= 0.8 + 0.2 * sin(ringPos * 31.0 + uTime * 3.1);

                    // Occasional bright flares
                    float flare = 0.0;
                    for (int i = 0; i < 5; i++) {
                        float flarePos = hash1D(float(i) * 17.7 + uTime * 0.3) * 0.8 + 0.1;
                        float flareWidth = 0.03 + hash1D(float(i) * 23.1) * 0.06;
                        float distToFlare = abs(ringPos - flarePos);
                        distToFlare = min(distToFlare, 1.0 - distToFlare); // wrap around
                        flare += exp(-distToFlare * distToFlare / (flareWidth * flareWidth)) * 1.5;
                    }
                    variation += flare * 0.5;

                    // Edge softening on the tube
                    float edgeSoft = 1.0 - abs(tubePos - 0.5) * 2.0;
                    edgeSoft = pow(edgeSoft, 0.55);
                    edgeSoft = smoothstep(0.0, 0.15, edgeSoft);

                    // Color: golden-white to hot white
                    vec3 baseColor = mix(vec3(1.0, 0.85, 0.4), vec3(1.0, 0.95, 0.85), variation);
                    vec3 hotColor = vec3(1.0, 0.98, 0.92);

                    vec3 color = mix(baseColor, hotColor, variation * 0.7);
                    color *= 1.8 * uIntensity;

                    // Add blue-white sparkle at peaks
                    float sparkle = pow(variation, 6.0);
                    color += vec3(0.3, 0.5, 1.0) * sparkle * 0.6;

                    float alpha = variation * edgeSoft;
                    alpha = clamp(alpha, 0.0, 1.0);

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
        });

        const torusRing = new THREE.Mesh(torusGeom, torusShader);
        torusRing.renderOrder = 2;
        torusRing.rotation.x = Math.PI / 2;
        portalGroup.add(torusRing);

        // ─────────────────────────────────────
        // OUTER GLOW SPRITES
        // ─────────────────────────────────────
        const outerGlowSprites = [];
        for (let i = 0; i < 5; i++) {
            const spriteMat = new THREE.SpriteMaterial({
                map: i < 2 ? glowTexBlue : glowTexLarge,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: true,
                transparent: true,
                opacity: 0.5 + Math.random() * 0.4,
                color: i < 2 ? new THREE.Color(0x5588cc) : new THREE.Color(0xffcc88),
            });
            const sprite = new THREE.Sprite(spriteMat);
            const scale = 2.8 + i * 0.8;
            sprite.scale.set(scale, scale, 1);
            sprite.position.z = -0.05 - i * 0.04;
            sprite.renderOrder = 0;
            portalGroup.add(sprite);
            outerGlowSprites.push({ sprite, baseScale: scale, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() *
                    0.6 });
        }

        // ─────────────────────────────────────
        // VOLUMETRIC RAYS (God rays)
        // ─────────────────────────────────────
        const raySprites = [];
        const rayCount = 10;
        for (let i = 0; i < rayCount; i++) {
            const rayMat = new THREE.SpriteMaterial({
                map: rayTex,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: true,
                transparent: true,
                opacity: 0.35 + Math.random() * 0.4,
                color: new THREE.Color().setHSL(0.6 + Math.random() * 0.15, 0.6, 0.5 + Math.random() * 0.4),
            });
            const raySprite = new THREE.Sprite(rayMat);
            const angle = (i / rayCount) * Math.PI * 2 + Math.random() * 0.3;
            const rayLength = 3.5 + Math.random() * 5;
            raySprite.scale.set(0.4 + Math.random() * 0.6, rayLength, 1);
            raySprite.position.set(
                Math.cos(angle) * rayLength * 0.5,
                Math.sin(angle) * rayLength * 0.5,
                -0.2 - Math.random() * 0.5
            );
            raySprite.renderOrder = 0;
            raySprite.rotation.z = angle;
            portalGroup.add(raySprite);
            raySprites.push({
                sprite: raySprite,
                angle,
                baseLength: rayLength,
                phase: Math.random() * Math.PI * 2,
                speed: 0.3 + Math.random() * 0.7,
                baseOpacity: 0.3 + Math.random() * 0.45,
            });
        }

        // ─────────────────────────────────────
        // ABSORPTION PARTICLES
        // ─────────────────────────────────────
        const absorbedParticleCount = 250;
        const absorbedGeom = new THREE.BufferGeometry();
        const absorbedPositions = new Float32Array(absorbedParticleCount * 3);
        const absorbedColors = new Float32Array(absorbedParticleCount * 3);
        const absorbedSizes = new Float32Array(absorbedParticleCount);

        // Particle state stored in arrays
        const particleStates = [];
        for (let i = 0; i < absorbedParticleCount; i++) {
            const state = {
                radius: 1.5 + Math.random() * 7,
                angle: Math.random() * Math.PI * 2,
                height: (Math.random() - 0.5) * 4,
                speed: 0.3 + Math.random() * 2.5,
                life: Math.random(),
                maxRadius: 1.5 + Math.random() * 7,
                spiralTightness: 0.6 + Math.random() * 2.0,
            };
            state.radius = state.maxRadius;
            particleStates.push(state);

            // Initial position
            const x = state.radius * Math.cos(state.angle);
            const y = state.height;
            const z = state.radius * Math.sin(state.angle);
            absorbedPositions[i * 3] = x;
            absorbedPositions[i * 3 + 1] = y;
            absorbedPositions[i * 3 + 2] = z;

            // Color based on distance
            const t = state.radius / 8;
            const col = new THREE.Color();
            col.setHSL(0.58 + t * 0.2, 0.8, 0.4 + (1 - t) * 0.5);
            absorbedColors[i * 3] = col.r;
            absorbedColors[i * 3 + 1] = col.g;
            absorbedColors[i * 3 + 2] = col.b;

            absorbedSizes[i] = 0.02 + Math.random() * 0.06;
        }

        absorbedGeom.setAttribute('position', new THREE.BufferAttribute(absorbedPositions, 3));
        absorbedGeom.setAttribute('color', new THREE.BufferAttribute(absorbedColors, 3));
        absorbedGeom.setAttribute('size', new THREE.BufferAttribute(absorbedSizes, 1));

        const absorbedMat = new THREE.PointsMaterial({
            size: 0.05,
            map: softParticleTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.8,
        });

        const absorbedPoints = new THREE.Points(absorbedGeom, absorbedMat);
        absorbedPoints.renderOrder = 3;
        portalGroup.add(absorbedPoints);

        // ─────────────────────────────────────
        // FOREGROUND DEBRIS (floating between camera and portal)
        // ─────────────────────────────────────
        const debrisCount = 40;
        const debrisGeom = new THREE.BufferGeometry();
        const debrisPositions = new Float32Array(debrisCount * 3);
        const debrisData = [];
        for (let i = 0; i < debrisCount; i++) {
            const d = {
                x: (Math.random() - 0.5) * 6,
                y: (Math.random() - 0.5) * 5,
                z: 0.8 + Math.random() * 2.5,
                vx: (Math.random() - 0.5) * 0.15,
                vy: (Math.random() - 0.5) * 0.15,
                vz: -0.02 - Math.random() * 0.08,
                life: Math.random(),
                baseX: 0,
                baseY: 0,
                baseZ: 0,
            };
            d.baseX = d.x;
            d.baseY = d.y;
            d.baseZ = d.z;
            debrisData.push(d);
            debrisPositions[i * 3] = d.x;
            debrisPositions[i * 3 + 1] = d.y;
            debrisPositions[i * 3 + 2] = d.z;
        }
        debrisGeom.setAttribute('position', new THREE.BufferAttribute(debrisPositions, 3));
        const debrisMat = new THREE.PointsMaterial({
            size: 0.03,
            map: softParticleTex,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.5,
            color: new THREE.Color(0x8899cc),
        });
        const debrisPoints = new THREE.Points(debrisGeom, debrisMat);
        debrisPoints.renderOrder = 4;
        scene.add(debrisPoints);

        // ─────────────────────────────────────
        // FRACTURE CRACKS (lines radiating from portal)
        // ─────────────────────────────────────
        const crackGroup = new THREE.Group();
        portalGroup.add(crackGroup);
        const crackCount = 7;
        for (let i = 0; i < crackCount; i++) {
            const angle = (i / crackCount) * Math.PI * 2 + Math.random() * 0.5;
            const crackLength = 1.5 + Math.random() * 3.5;
            const crackGeom = new THREE.PlaneGeometry(0.03, crackLength);
            const crackMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 0.5, 0.6 + Math.random() * 0.4),
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: true,
                transparent: true,
                opacity: 0.5 + Math.random() * 0.4,
                side: THREE.DoubleSide,
            });
            const crack = new THREE.Mesh(crackGeom, crackMat);
            crack.position.set(
                Math.cos(angle) * (1.2 + crackLength * 0.4),
                Math.sin(angle) * (1.2 + crackLength * 0.4),
                -0.08 - Math.random() * 0.15
            );
            crack.rotation.z = angle;
            crack.renderOrder = 1;
            crack.userData = { angle, baseOpacity: 0.4 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2,
                speed: 0.5 + Math.random() * 1.5 };
            crackGroup.add(crack);
        }

        // ─────────────────────────────────────
        // POST-PROCESSING
        // ─────────────────────────────────────
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Chromatic Aberration Shader Pass
        const chromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uCenter: { value: new THREE.Vector2(0.5, 0.5) },
                uIntensity: { value: 1.0 },
                uTime: { value: 0 },
            },
            vertexShader: /* glsl */ `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: /* glsl */ `
                varying vec2 vUv;
                uniform sampler2D tDiffuse;
                uniform vec2 uCenter;
                uniform float uIntensity;
                uniform float uTime;

                void main() {
                    vec2 dir = vUv - uCenter;
                    float dist = length(dir);
                    vec2 normDir = dist > 0.001 ? dir / dist : vec2(0.0, 1.0);

                    // Aberration strongest near portal, falls off with distance
                    float strength = uIntensity * (1.0 / (dist * 1.8 + 0.45)) * 0.025;

                    // Add subtle oscillation
                    strength *= 0.85 + 0.15 * sin(dist * 30.0 - uTime * 2.0);

                    // Sample RGB with offsets
                    float r = texture2D(tDiffuse, vUv + normDir * strength).r;
                    float g = texture2D(tDiffuse, vUv).g;
                    float b = texture2D(tDiffuse, vUv - normDir * strength).b;

                    // Also sample a slight tangential offset for more complexity
                    vec2 tangentDir = vec2(-normDir.y, normDir.x);
                    float tangentialStrength = strength * 0.4;
                    float r2 = texture2D(tDiffuse, vUv + tangentDir * tangentialStrength).r;
                    float b2 = texture2D(tDiffuse, vUv - tangentDir * tangentialStrength).b;
                    r = mix(r, r2, 0.25);
                    b = mix(b, b2, 0.25);

                    gl_FragColor = vec4(r, g, b, 1.0);
                }
            `,
        };

        const chromaticPass = new ShaderPass(chromaticAberrationShader);
        chromaticPass.renderToScreen = true;
        composer.addPass(chromaticPass);

        // ─────────────────────────────────────
        // MOUSE TRACKING
        // ─────────────────────────────────────
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0, smoothedX: 0, smoothedY: 0 };
        const portalScreenPos = { x: 0.5, y: 0.5 };

        function updateMouse(clientX, clientY) {
            mouse.targetX = (clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(clientY / window.innerHeight) * 2 + 1;

            // Update cursor glow
            cursorGlow.style.left = clientX + 'px';
            cursorGlow.style.top = clientY + 'px';
            cursorGlow.style.opacity = '1';
        }

        window.addEventListener('mousemove', (e) => {
            updateMouse(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateMouse(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('mouseleave', () => {
            cursorGlow.style.opacity = '0';
            mouse.targetX = 0;
            mouse.targetY = 0;
        });

        window.addEventListener('mouseenter', () => {
            cursorGlow.style.opacity = '1';
        });

        // ─────────────────────────────────────
        // RESIZE HANDLER
        // ─────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─────────────────────────────────────
        // ANIMATION LOOP
        // ─────────────────────────────────────
        const clock = new THREE.Clock();
        let timeAccum = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            timeAccum += dt;

            // Smooth mouse
            mouse.smoothedX += (mouse.targetX - mouse.smoothedX) * 4 * dt;
            mouse.smoothedY += (mouse.targetY - mouse.smoothedY) * 4 * dt;
            mouse.x = mouse.smoothedX;
            mouse.y = mouse.smoothedY;

            // Distance of mouse from portal center (screen space)
            const mouseDistFromPortal = Math.sqrt(
                (mouse.x - 0) * (mouse.x - 0) + (mouse.y - 0) * (mouse.y - 0)
            );
            const proximityFactor = Math.max(0, 1 - mouseDistFromPortal / 1.2);

            // Update portal group rotation based on mouse
            const targetRotX = mouse.y * 0.25;
            const targetRotY = mouse.x * 0.3;
            portalGroup.rotation.x += (targetRotX - portalGroup.rotation.x) * 3 * dt;
            portalGroup.rotation.y += (targetRotY - portalGroup.rotation.y) * 3 * dt;

            // Update shader uniforms
            portalInteriorShader.uniforms.uTime.value = timeAccum;
            portalInteriorShader.uniforms.uMouseDistortion.value.set(mouse.x, mouse.y);
            portalInteriorShader.uniforms.uIntensity.value = 1.0 + proximityFactor * 0.6;

            torusShader.uniforms.uTime.value = timeAccum;
            torusShader.uniforms.uIntensity.value = 1.0 + proximityFactor * 0.5;

            // Project portal world position to screen for chromatic aberration
            const portalWorldPos = new THREE.Vector3(0, 0, 0);
            portalGroup.localToWorld(portalWorldPos);
            const projected = portalWorldPos.clone().project(camera);
            portalScreenPos.x = projected.x * 0.5 + 0.5;
            portalScreenPos.y = projected.y * 0.5 + 0.5;

            chromaticPass.uniforms['uCenter'].value.set(portalScreenPos.x, portalScreenPos.y);
            chromaticPass.uniforms['uIntensity'].value = 1.0 + proximityFactor * 0.8;
            chromaticPass.uniforms['uTime'].value = timeAccum;

            // Update outer glow sprites
            outerGlowSprites.forEach((g, i) => {
                const pulse = 1 + Math.sin(timeAccum * g.speed + g.phase) * 0.15;
                const proxPulse = 1 + proximityFactor * 0.25;
                g.sprite.scale.set(g.baseScale * pulse * proxPulse, g.baseScale * pulse * proxPulse, 1);
                g.sprite.material.opacity = (0.45 + Math.sin(timeAccum * g.speed + g.phase) * 0.2) * (1 +
                    proximityFactor * 0.4);
            });

            // Update ray sprites
            raySprites.forEach((r) => {
                const pulse = 1 + Math.sin(timeAccum * r.speed + r.phase) * 0.3;
                r.sprite.material.opacity = r.baseOpacity * pulse * (1 + proximityFactor * 0.5);
                r.sprite.scale.y = r.baseLength * pulse;
            });

            // Update absorption particles
            const posArray = absorbedGeom.attributes.position.array;
            const colArray = absorbedGeom.attributes.color.array;
            const sizeArray = absorbedGeom.attributes.size.array;

            for (let i = 0; i < absorbedParticleCount; i++) {
                const state = particleStates[i];
                state.angle += state.speed * dt * (1.0 / (state.radius + 0.15)) * state.spiralTightness;
                state.radius -= state.speed * dt * 0.55;
                state.height *= 0.995;

                // Reset if absorbed
                if (state.radius < 0.08) {
                    state.radius = state.maxRadius;
                    state.angle = Math.random() * Math.PI * 2;
                    state.height = (Math.random() - 0.5) * 4;
                    state.speed = 0.3 + Math.random() * 2.5;
                }

                const x = state.radius * Math.cos(state.angle);
                const y = state.height;
                const z = state.radius * Math.sin(state.angle);

                posArray[i * 3] = x;
                posArray[i * 3 + 1] = y;
                posArray[i * 3 + 2] = z;

                // Color shifts as particle approaches portal
                const t = state.radius / state.maxRadius;
                const col = new THREE.Color();
                col.setHSL(0.55 + t * 0.25, 0.9, 0.3 + (1 - t) * 0.6);
                colArray[i * 3] = col.r;
                colArray[i * 3 + 1] = col.g;
                colArray[i * 3 + 2] = col.b;

                sizeArray[i] = (0.015 + (1 - t) * 0.07) * (1 + proximityFactor * 0.5);
            }
            absorbedGeom.attributes.position.needsUpdate = true;
            absorbedGeom.attributes.color.needsUpdate = true;
            absorbedGeom.attributes.size.needsUpdate = true;

            // Update debris particles
            const debrisPosArray = debrisGeom.attributes.position.array;
            for (let i = 0; i < debrisCount; i++) {
                const d = debrisData[i];
                d.x += d.vx * dt;
                d.y += d.vy * dt;
                d.z += d.vz * dt;

                // Attract slightly toward portal
                const dx = -d.x;
                const dy = -d.y;
                const distToPortal = Math.sqrt(dx * dx + dy * dy) + 0.5;
                const attractionStrength = 0.15 / (distToPortal * distToPortal);
                d.vx += dx * attractionStrength * dt;
                d.vy += dy * attractionStrength * dt;

                // Damping
                d.vx *= 0.995;
                d.vy *= 0.995;

                // Reset if too far or too close
                if (d.z < -2 || d.z > 4 || Math.abs(d.x) > 8 || Math.abs(d.y) > 7) {
                    d.x = (Math.random() - 0.5) * 5;
                    d.y = (Math.random() - 0.5) * 4;
                    d.z = 1.5 + Math.random() * 2;
                    d.vx = (Math.random() - 0.5) * 0.1;
                    d.vy = (Math.random() - 0.5) * 0.1;
                    d.vz = -0.01 - Math.random() * 0.06;
                }

                debrisPosArray[i * 3] = d.x;
                debrisPosArray[i * 3 + 1] = d.y;
                debrisPosArray[i * 3 + 2] = d.z;
            }
            debrisGeom.attributes.position.needsUpdate = true;

            // Update crack opacities
            crackGroup.children.forEach((crack) => {
                const ud = crack.userData;
                const pulse = 0.6 + 0.4 * Math.sin(timeAccum * ud.speed + ud.phase);
                crack.material.opacity = ud.baseOpacity * pulse * (1 + proximityFactor * 0.6);
            });

            // Subtle star rotation
            stars.rotation.y += dt * 0.015;
            stars.rotation.x += dt * 0.005;

            // Render
            composer.render();
        }

        // ─────────────────────────────────────
        // INITIAL SETUP & START
        // ─────────────────────────────────────
        composer.setSize(window.innerWidth, window.innerHeight);
        chromaticPass.uniforms['uCenter'].value.set(0.5, 0.5);

        // Set initial cursor glow position
        cursorGlow.style.left = '50%';
        cursorGlow.style.top = '50%';

        // Kick off animation
        requestAnimationFrame(animate);

        // ─────────────────────────────────────
        // CONSOLE EASTER EGG
        // ─────────────────────────────────────
        console.log(
            '%c🔮 Reality Fracture Portal Active %c| %cDimensional stability: 34.7% %c| %cProceed with caution.',
            'font-size:1.2em;color:#c8d0f0;',
            '',
            'color:#ff8844;',
            '',
            'color:#8899cc;'
        );
        console.log(
            '%cThe veil between realities grows thin...',
            'font-style:italic;color:#666;'
        );
    </script>
</body>
</html>
