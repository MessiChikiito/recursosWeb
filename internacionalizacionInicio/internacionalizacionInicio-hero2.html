

<style>
  * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }
  .elementor-widget-html {
    padding: 0 !important;
    margin: 0 !important
  }

  .elementor-widget-html>.elementor-widget-container {
    padding: 0 !important;
    margin: 0 !important;
    line-height: 0 !important
  }

  .uei-root {
    font-family: 'Inter', system-ui, sans-serif;
    background: #FFFFFF;
    width: 100%;
    line-height: normal
  }

  .uei-root *,
  .uei-root *::before,
  .uei-root *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  .uei-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 0px 48px 120px;
    max-width: 1600px;
    margin: 0 auto
  }

  .uei-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%
  }

  .uei-text {
    flex: 0 0 280px;
    max-width: 280px;
    margin-right: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center
  }

  .uei-eyebrow {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #EF1218 !important;
    border-bottom: 2px solid #EF1218;
    display: inline-block;
    padding-bottom: 3px;
    margin-bottom: 18px;
    width: fit-content;
    -webkit-text-stroke: 2px rgb(255, 255, 255);
    paint-order: stroke;
  }

  .uei-title {
    font-size: 3rem;
    font-weight: 900;
    line-height: 1.0;
    color: #0132AF !important;
    letter-spacing: -.03em;
    margin-bottom: 18px;
    -webkit-text-stroke: 3px rgb(255, 255, 255);
    paint-order: stroke;
  }

  .uei-sub {
    font-size: .98rem;
    font-weight: 700;
    color: #000;
    margin-bottom: 10px
  }

  .uei-desc {
    font-size: .88rem;
    color: #000;
    line-height: 1.65
  }

  .uei-mapc {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden
  }

  .uei-mapf {
    border-radius: 20px;
    border: none;
    background: transparent;
    padding: 10px;
    display: block;
    width: 100%
  }

  .uei-mapr {
    position: relative;
    width: 100%;
    padding-bottom: 53.85%;
    height: 0;
    overflow: hidden;
    border-radius: 14px;
    background: transparent;
    display: block
  }

  .uei-mapr>svg {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    display: block !important;
    border-radius: 14px
  }

  .elementor-widget-html .uei-mapc,
  .elementor-widget-html .uei-mapf {
    display: block !important;
    width: 100% !important
  }

  .elementor-widget-html .uei-mapr {
    display: block !important;
    width: 100% !important;
    height: 0 !important;
    padding-bottom: 53.85% !important;
    overflow: hidden !important
  }

  .elementor-widget-html .uei-mapr>svg {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important
  }

  .uei-cb {
    fill: #d6e2ec;
    stroke: #bfcdd9;
    stroke-width: .5;
    stroke-linejoin: round;
    stroke-linecap: round
  }

  /* ── Paths destacados ── */
  .uei-ch {
    fill: #4a7fa5;
    stroke: #0080FF;
    stroke-width: 2;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill .18s ease, transform .18s ease, filter .18s ease;
    transform-origin: center;
    transform-box: fill-box;
    filter: drop-shadow(0 0 8px rgba(0, 128, 255, 0.7))
  }

  .uei-ch:hover {
    fill: #2e5f80;
    transform: translateY(-3px);
    filter: drop-shadow(0 0 12px rgba(0, 128, 255, 1))
  }

  .uei-ch.uei-flash {
    animation: ueiFlash .3s ease-out
  }

  @keyframes ueiFlash {
    0% {
      filter: brightness(1)
    }

    50% {
      filter: brightness(1.35) drop-shadow(0 0 10px rgba(255, 210, 60, .85))
    }

    100% {
      filter: brightness(1)
    }
  }

  /* ── Tooltip desktop ── */
  .uei-tip {
    position: fixed;
    background: #fff;
    border-radius: 16px;
    padding: 14px 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
    font-family: 'Inter', sans-serif;
    font-size: .82rem;
    line-height: 1.55;
    color: #1e2f3e;
    max-width: 290px;
    pointer-events: none;
    z-index: 99999;
    border: 1px solid #e0eaf2;
    font-weight: 500;
    word-wrap: break-word;
    opacity: 0;
    visibility: hidden;
    transition: opacity .1s ease
  }

  .uei-tip.uei-on {
    opacity: 1;
    visibility: visible
  }

  .uei-tip-h {
    display: block;
    font-size: .9rem;
    font-weight: 700;
    color: #0132AF;
    margin-bottom: 8px;
    border-left: 3px solid #EF1218;
    padding-left: 9px;
    line-height: 1.3
  }

  .uei-tip-ul {
    margin: 0;
    padding: 0;
    list-style: none
  }

  .uei-tip-ul li {
    margin-bottom: 5px;
    padding-left: 13px;
    position: relative;
    font-size: .8rem;
    color: #334
  }

  .uei-tip-ul li::before {
    content: "•";
    color: #EF1218;
    font-weight: 700;
    position: absolute;
    left: 0
  }

  
  .uei-mapr {
    position: relative
  }


  /* ── Zona de tooltip mobile (debajo del mapa) ── */
  .uei-tip-zone {
    display: none;
    width: 100%;
    min-height: 0;
    transition: min-height .2s ease;
  }

  @media(max-width:767px) {
    .uei-tip-zone {
      display: block
    }
  }

  .uei-tipm {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #dde6f0;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .10);
    padding: 14px 42px 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: .84rem;
    line-height: 1.45;
    color: #1e2f3e;
    position: relative;
    animation: ueiTipmIn .22s ease-out;
    margin-top: 10px;
  }

  @keyframes ueiTipmIn {
    from {
      opacity: 0;
      transform: translateY(-6px)
    }

    to {
      opacity: 1;
      transform: translateY(0)
    }
  }

  .uei-tipm .uei-tip-h {
    font-size: .88rem;
    margin-bottom: 8px
  }

  .uei-tipm .uei-tip-ul li {
    margin-bottom: 6px;
    font-size: .8rem
  }

  .uei-tip-x {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(240, 244, 248, .9);
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 14px;
    line-height: 28px;
    text-align: center;
    cursor: pointer;
    color: #888;
    transition: background .15s, color .15s;
    padding: 0;
  }

  .uei-tip-x:hover {
    background: #fde8e8;
    color: #EF1218
  }

  .uei-hint {
    display: none;
    text-align: center;
    font-size: .72rem;
    color: #8fa4b5;
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
  }

  @media(max-width:767px) {
    .uei-hint {
      display: block
    }
  }

  /* ── Responsive ── */
  @media(max-width:767px) {
    .uei-wrap {
      padding: 24px
    }

    .uei-inner {
      flex-direction: column;
      gap: 22px
    }

    .uei-text {
      flex: none;
      max-width: 100%;
      text-align: center;
      margin-right: 0;
    }

    .uei-eyebrow {
      margin: 0 auto 14px
    }

    .uei-title {
      font-size: 2.2rem
    }

    .uei-mapc {
      width: 100%
    }

  }

  @media(min-width:768px) and (max-width:1100px) {
    .uei-wrap {
      padding: 32px 36px
    }

    .uei-inner {
      gap: 36px
    }

    .uei-text {
      flex: 0 0 230px;
      max-width: 230px
    }

    .uei-title {
      font-size: 2.4rem
    }
  }
</style>

        '<button class="uei-tip-x" aria-label="Cerrar">&#x2715;</button>' +
        '<ul class="uei-tip-ul">' + li + '</ul>';
      div.querySelector('.uei-tip-x').addEventListener('click', function (e) {
        e.stopPropagation(); rmMTip();
      });
      /* Insertar en la zona debajo del mapa */
      tipZone.innerHTML = '';
      tipZone.appendChild(div);
      mTip = div; openC = n;
    }
    function rmMTip() {
      if (mTip) { mTip.remove(); mTip = null; }
      if (tipZone) tipZone.innerHTML = '';
      openC = null;
    }

    function goTo(sel, el) {
      var t = document.querySelector(sel);
      if (t) {
        if (el) { el.classList.add('uei-flash'); setTimeout(function () { el.classList.remove('uei-flash'); }, 350); }
        t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (history.pushState) history.pushState(null, null, sel);
        if (isT) rmMTip(); else hideTip();
      }
    }

    document.querySelectorAll('.uei-ch').forEach(function (p) {
      var n = p.getAttribute('data-c');
      if (!n || !D.u[n]) return;
      if (isT) {
        p.addEventListener('click', function (e) {
          e.stopPropagation(); e.preventDefault();
          if (openC === n) {
            var a = D.a[n]; if (a) goTo(a, p);
            rmMTip();
          } else {
            showMTip(n);
          }
        });
      } else {
        p.addEventListener('mouseenter', function (e) { showTip(e, n); });
        p.addEventListener('mousemove', function (e) { placeTip(e); });
        p.addEventListener('mouseleave', function () { hideTip(); });
        p.addEventListener('click', function (e) {
          e.stopPropagation();
          var a = D.a[n]; if (a) goTo(a, p);
        });
      }
    });

    if (isT) {
      /* Cerrar al tocar fuera — pero solo dentro del mapa o fuera de todo */
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.uei-ch') && !e.target.closest('.uei-tipm')) rmMTip();
      });
    }
  })();
</script>
